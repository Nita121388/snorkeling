<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: rounded square with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67e8f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGrad)"/>

  <!-- Hexagonal frame (outer) -->
  <polygon points="256,60 408,148 408,364 256,452 104,364 104,148"
           fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Hexagonal frame (inner) -->
  <polygon points="256,90 382,162 382,350 256,422 130,350 130,162"
           fill="none" stroke="#334155" stroke-width="1.5" opacity="0.5"/>

  <!-- Wave lines (snorkeling concept) -->
  <g filter="url(#glow)">
    <path d="M120 220 Q170 180, 220 220 T320 220 T420 220"
          fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 260 Q170 220, 220 260 T320 260 T420 260"
          fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M120 300 Q170 260, 220 300 T320 300 T420 300"
          fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Terminal prompt symbols -->
  <g fill="#f8fafc" font-family="monospace" font-weight="bold">
    <!-- > cursor -->
    <text x="150" y="400" font-size="64" fill="url(#accentGrad)">&gt;</text>
    <!-- underscore cursor blink -->
    <rect x="200" y="375" width="40" height="6" rx="3" fill="url(#accentGrad)"/>
  </g>

  <!-- Snorkel tube hint (small detail) -->
  <g transform="translate(340, 120) rotate(-30)">
    <rect x="0" y="0" width="60" height="8" rx="4" fill="#67e8f9" opacity="0.8"/>
    <circle cx="65" cy="4" r="6" fill="#22d3ee"/>
  </g>

  <!-- Corner accents -->
  <circle cx="256" cy="60" r="6" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="256" cy="452" r="6" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="104" cy="256" r="4" fill="#334155"/>
  <circle cx="408" cy="256" r="4" fill="#334155"/>
</svg>
