<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Modern minimal square with cut corners -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield-like shape with flat top -->
  <path d="M80 100 L256 60 L432 100 L432 380 Q432 440 380 450 L256 480 L132 450 Q80 440 80 380 Z"
        fill="url(#bg2)" stroke="#334155" stroke-width="2"/>

  <!-- Horizontal wave bands (representing water/surfacing) -->
  <g filter="url(#glow2)">
    <path d="M120 200 L392 200" stroke="url(#cyanLine)" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 240 Q160 220, 200 240 T300 240 T400 240"
          fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M100 280 Q160 260, 200 280 T300 280 T400 280"
          fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Terminal > prompt -->
  <text x="160" y="390" font-family="Consolas, monospace" font-size="72" font-weight="bold" fill="#f97316">&gt;_</text>

  <!-- Rising bubble accents -->
  <circle cx="380" cy="160" r="8" fill="#22d3ee" opacity="0.9" filter="url(#glow2)"/>
  <circle cx="400" cy="130" r="5" fill="#67e8f9" opacity="0.7"/>
  <circle cx="365" cy="100" r="4" fill="#67e8f9" opacity="0.5"/>

  <!-- Bottom wave line -->
  <path d="M120 420 L392 420" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 4"/>
</svg>
