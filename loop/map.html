<!doctype html>
<!--
  loop map 模板 —— 派生自 project-map v0.1.0 的 src/template.html（同作者的 pmap 交互原型）。
  改动（与上游的差异就这些，改模板前先看这里）：
    1. 文案：Bug → 修改点（修改点 = loop 工作项 items/*.md）
    2. 页内新建的落点：功能/模块/版本 → loop/map/{features,modules,releases}/，
       修改点 → loop/items/<id>.md（loop 工作项格式，不是 pmap 的 bug md）
    3. 页内编辑：http 服务模式 POST /api/new 给引擎写 md；file:// 仍保留直写分支；
       API 根与 repo 由渲染方注入（看板 = /api/map，独立服务 = /api）
    4. 时间线：布局纯函数由 lib/map-layout.mjs 注入；默认窗口围绕真实活动日，空日期不再污染成 NaN；
       功能超过一屏时 SVG 撑高、外层纵向滚动，键盘焦点自动滚入可视区
    5. 标签：按实际文字宽度决定是否翻到节点左侧，不再用固定 170px 阈值
  升级上游模板时：整份替换后按上面五条重打补丁，别逐行手工合并。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Snorkeling · 项目地图</title>
<style>
:root{
  color-scheme:dark;
  /* HeroUI 默认暗色主题色板 + zinc 表面阶 */
  --bg:#000000; --bg2:#0a0a0c; --panel:#18181b; --panel2:#27272a; --panel3:#3f3f46;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#ececee; --mut:#a1a1aa; --dim:#71717a;
  --acc:#006fee; --ok:#17c964; --warn:#f5a524; --err:#f31260;
  --acc-soft:rgba(0,111,238,.14); --acc-line:rgba(0,111,238,.5);
  --ring:0 0 0 3px rgba(0,111,238,.28);
  --hd-bg:rgba(0,0,0,.6);
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --sans:"Inter","SF Pro Text",system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --link:#2b3441; --spine:#2f3a47; --grid:#16181d; --band:rgba(255,255,255,.02);
  --sep:#1c2027; --pill-bg:#1d2026; --rel-line:#232a35; --tag:#9ec5ff;
  --mod-dot:#6b7280; --mod-label:#ececee; --feat-label:#d4d4d8; --child-label:#a1a1aa;
  --node-stroke:#000000; --hover:rgba(255,255,255,.045); --hover-label:#ffffff;
  --card-bg:rgba(24,24,27,.92); --card-line:rgba(255,255,255,.12);
  --card-shadow:0 24px 56px -16px rgba(0,0,0,.78),0 2px 10px rgba(0,0,0,.45);
  --today:rgba(0,111,238,.55); --life-opacity:.5;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --bg2:#fafafa; --panel:#f4f4f5; --panel2:#e9e9eb; --panel3:#d4d4d8;
  --line:rgba(17,24,28,.09); --line2:rgba(17,24,28,.16);
  --txt:#11181c; --mut:#5c6370; --dim:#8a8f98;
  --acc:#006fee; --ok:#12a150; --warn:#d97706; --err:#f31260;
  --acc-soft:rgba(0,111,238,.09); --acc-line:rgba(0,111,238,.42);
  --ring:0 0 0 3px rgba(0,111,238,.18);
  --hd-bg:rgba(255,255,255,.72);
  --link:#ccd4de; --spine:#c8d0da; --grid:#eef0f4; --band:rgba(0,0,0,.02);
  --sep:#e9ecf1; --pill-bg:#f2f4f7; --rel-line:#dbe1e9; --tag:#2f5fa8;
  --mod-dot:#8b93a0; --mod-label:#11181c; --feat-label:#3f3f46; --child-label:#6b7280;
  --node-stroke:#ffffff; --hover:rgba(0,111,238,.06); --hover-label:#006fee;
  --card-bg:rgba(255,255,255,.94); --card-line:rgba(17,24,28,.1);
  --card-shadow:0 24px 48px -18px rgba(24,24,27,.24),0 2px 8px rgba(24,24,27,.06);
  --today:rgba(0,111,238,.5); --life-opacity:.75;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.55 var(--sans);overflow:hidden;
  height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
::selection{background:rgba(0,111,238,.32)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.proto-flag{position:fixed;top:10px;right:12px;z-index:99;font-family:var(--mono);font-size:10px;
  color:var(--warn);background:color-mix(in oklab,var(--warn) 12%,transparent);
  border:1px solid color-mix(in oklab,var(--warn) 32%,transparent);
  padding:3px 9px;border-radius:999px;pointer-events:none;backdrop-filter:blur(8px)}

header{display:flex;align-items:center;gap:10px;padding:8px 16px;padding-right:300px;
  flex-wrap:wrap;border-bottom:1px solid var(--line);
  background:var(--hd-bg);backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);flex:none;z-index:20}
.sec-line{flex:1 1 100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .mark{width:22px;height:22px;border-radius:7px;flex:none;
  background:linear-gradient(135deg,#00c2ff,#006fee 48%,#7b61ff);
  box-shadow:0 2px 10px rgba(0,111,238,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.brand b{font-size:14.5px;font-weight:700;letter-spacing:.2px}
.brand span{color:var(--mut);font-size:11.5px}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--panel);padding:2px}
.layout-ctl{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--mut);
  padding:3px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.layout-ctl input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;
  border-radius:999px;cursor:pointer;outline:none;
  background:linear-gradient(90deg,var(--acc) var(--fill,100%),var(--line2) var(--fill,100%))}
.layout-ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:#fff;border:none;cursor:grab;
  box-shadow:0 0 0 1px var(--line2),0 2px 6px rgba(0,0,0,.45);
  transition:transform .15s ease,box-shadow .15s ease}
.layout-ctl input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.1)}
.layout-ctl input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15);
  box-shadow:0 0 0 1px var(--acc),0 0 0 5px var(--acc-soft)}
.layout-ctl input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1px var(--line2)}
.seg button{padding:3px 12px;font-size:12px;color:var(--mut);border-radius:999px;transition:.16s}
.seg button.on{background:var(--acc);color:#fff}
.seg button+button{border-left:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);color:var(--mut);font-size:12px;
  font-weight:500;user-select:none;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.chip:hover{color:var(--txt);background:var(--panel2);transform:translateY(-1px)}
.chip:active{transform:scale(.96)}
.chip.on{color:#fff;border-color:var(--acc);background:var(--acc);
  box-shadow:0 4px 14px -4px rgba(0,111,238,.6)}
.chip.on:hover{background:var(--acc);filter:brightness(1.08)}
.ico{stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip .ico{width:13px;height:13px;stroke-width:1.7}
.chip.icon-only{padding:4px 9px}
.hide{display:none!important}
.legend{display:flex;gap:11px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.legend i.c-ok{background:var(--ok)}
.legend i.c-warn{background:var(--warn)}
.legend i.c-planned{border:1.5px dashed var(--dim);background:transparent}
.legend i.c-err{background:var(--err)}
.legend i.c-acc{background:var(--acc)}
.hint{color:var(--dim);font-size:11px;margin-left:auto;letter-spacing:.2px}

main{flex:1;display:flex;min-height:0}
.canvas-wrap{position:relative;flex:1;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#map{position:absolute;top:0;left:0;width:100%;height:100%;min-height:100%;display:block;user-select:none;cursor:default}
#map.pannable{cursor:grab;touch-action:pan-y}
#map.mind-mode{touch-action:none}
#map.dragging{cursor:grabbing}
aside{display:none}

/* SVG 通用 */
.link{fill:none;stroke:var(--link);stroke-width:1.2}
.branch{stroke:var(--link);stroke-width:1.2;fill:none}
.spine{stroke:var(--spine);stroke-width:1.6;pointer-events:none}
.rel-line{stroke:var(--rel-line);stroke-width:1;stroke-dasharray:3 5}
.rel-tag{font:10.5px var(--mono);fill:var(--tag)}
.axis-line{stroke:var(--line2);stroke-width:1}
.grid-line{stroke:var(--grid);stroke-width:1}
.axis-text{font:10.5px var(--mono);fill:var(--dim);letter-spacing:.3px}
.axis-text.today{fill:var(--acc);font-weight:600}
.today-line{stroke:var(--today);stroke-width:1.2;stroke-dasharray:3 4}
.band{fill:var(--band)}
.sep{stroke:var(--sep);stroke-width:1}
.band,.sep,.rel-line,.grid-line,.axis-line,.today-line,.link,.branch,.spine{pointer-events:none}
.root-dot{fill:var(--acc)}
.root-label{font:600 13px var(--sans);fill:var(--acc)}
.mod-dot{fill:var(--mod-dot)}
.mod-label{font:600 12.5px var(--sans);fill:var(--mod-label)}
.feat-dot.plan{fill:none}
.feat-label{font:12px var(--sans);fill:var(--feat-label)}
.feat-label.child{font-size:11.5px;fill:var(--child-label)}
.life{stroke-width:1.5;stroke-opacity:var(--life-opacity)}
.life.dep{stroke-dasharray:2 3}
.life.plan{stroke-dasharray:3 4}
.plan-band{fill:var(--acc);opacity:.035;pointer-events:none}
.bug-dot.fixed{fill:var(--acc)}
.bug-dot.open{fill:var(--err)}
.bug-dot{stroke:var(--node-stroke);stroke-width:1}
.feat-dot,.mod-dot,.bug-dot{transition:r .16s ease}
g.hit:hover .feat-dot{r:5.6px}
g.hit:hover .mod-dot{r:6px}
g.hit:hover .bug-dot{r:4.6px}
.dot-ring{fill:none;stroke-width:1.2;opacity:.6;pointer-events:none}
svg [data-toggle]{cursor:pointer}
svg [data-toggle]:hover{stroke:var(--txt);stroke-width:1.8}
.tree-label{font:12.5px var(--sans);fill:var(--feat-label)}
.tree-label.module{font-weight:600;fill:var(--txt)}
.tree-label.child{font-size:12px;fill:var(--child-label)}
.tree-label.root{font-size:14px;font-weight:600;fill:var(--txt)}
.tree-meta{font:11px var(--mono);fill:var(--dim)}
.rowbg{fill:transparent}
.rowactive{fill:var(--acc-soft)}
g.hit.focused .feat-label,g.hit.focused .mod-label{fill:var(--acc);font-weight:600}
.focus-ring{fill:none;stroke:var(--acc);stroke-width:1.6;pointer-events:none}
/* ===== 导图模式 ===== */
.layout-ctl.off{opacity:.38;pointer-events:none}
.mnode rect{stroke-width:1;transition:stroke .15s ease}
.mnode .mfeat-box{fill:var(--panel);stroke:var(--line2)}
.mnode .mmod-box{fill:var(--panel2);stroke:var(--line2)}
.mnode .mroot-box{fill:var(--acc-soft);stroke:var(--acc-line);stroke-width:1.2}
g.mnode:hover rect{stroke:var(--acc)}
g.hit.focused .mfeat-box,g.hit.focused .mmod-box,g.hit.focused .mroot-box{stroke:var(--acc);stroke-width:1.8}
.mlink{fill:none;stroke:var(--link);stroke-width:1.4;pointer-events:none}
.mdate{font:9.5px var(--mono);fill:var(--dim);letter-spacing:.3px}
.guide{stroke:var(--grid);stroke-width:1}
g.hit{cursor:pointer}
g.hit:hover .rowbg{fill:var(--hover)}
g.hit:hover .feat-label{fill:var(--hover-label)}
g.hit:hover .tree-label{fill:var(--hover-label)}
g.hit:hover .mod-label{fill:var(--txt)}
g.dim{opacity:.16;transition:opacity .15s}
.rel-pill{fill:var(--pill-bg);stroke:var(--line2)}
.root-box{fill:var(--acc-soft);stroke:var(--acc-line)}
g.hit:hover .bug-dot{stroke:var(--hover-label);stroke-width:1.5}
.rel-hit:hover .rel-pill{stroke:var(--acc)}

/* ===== 就地卡片 ===== */
#card{--card-acc:var(--acc);position:fixed;z-index:300;width:336px;max-height:min(74vh,600px);overflow:auto;display:none;
  background:linear-gradient(180deg,color-mix(in oklab,var(--card-acc) 8%,var(--card-bg)),var(--card-bg) 92px);
  border:1px solid var(--card-line);border-radius:16px;padding:0 16px 14px;
  box-shadow:var(--card-shadow);backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#card.open{display:block;animation:pop .16s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(5px) scale(.97)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;gap:9px;margin:0 -16px 12px;padding:13px 16px 11px;
  position:sticky;top:0;z-index:2;
  background:linear-gradient(180deg,color-mix(in oklab,var(--card-acc) 8%,var(--card-bg)),var(--card-bg) 74%,transparent);
  border-bottom:1px solid var(--line)}
.card-head::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--card-acc);box-shadow:0 0 0 3.5px color-mix(in oklab,var(--card-acc) 22%,transparent)}
.card-head h3{margin:0;font-size:14.5px;font-weight:600;flex:1;min-width:0;line-height:1.35;letter-spacing:.1px}
.card-x{flex:none;width:26px;height:26px;display:grid;place-items:center;
  color:var(--dim);font-size:14px;line-height:1;border-radius:999px;transition:.16s}
.card-x:hover{color:var(--txt);background:var(--panel2)}
.card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.card-btn{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:5px 12px;border:1px solid var(--line2);border-radius:10px;
  color:var(--txt);background:var(--panel2);cursor:pointer;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
.card-btn:hover{color:var(--acc);border-color:var(--acc-soft);background:var(--acc-soft);transform:translateY(-1px)}
.card-btn:active{transform:scale(.97)}
.card-btn .ico{width:11px;height:11px;stroke-width:1.8}
.card-btn:last-child{color:var(--acc);border-color:color-mix(in oklab,var(--acc) 35%,transparent);
  background:color-mix(in oklab,var(--acc) 12%,transparent)}
.card-btn:last-child:hover{color:#fff;background:var(--acc);border-color:var(--acc)}
.bugrow.hit{cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease}
.bugrow.hit:hover{background:color-mix(in oklab,var(--acc) 10%,var(--panel2));
  border-color:color-mix(in oklab,var(--acc) 32%,transparent);transform:translateX(2px)}
#card .sub{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;font-size:11.5px}
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:11px}
.tagchip.mono{font-family:var(--mono);font-size:10.5px}
.tagchip.draft{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 32%,transparent);
  background:color-mix(in oklab,var(--warn) 12%,transparent)}
#card .note{margin:0 0 12px;color:var(--mut);font-size:12px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#card .empty{padding:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 14px;margin:0 0 14px;font-size:12px}
.kv dt{color:var(--dim);white-space:nowrap;padding:6.5px 0;border-bottom:1px solid var(--line)}
.kv dd{margin:0;padding:6.5px 0;border-bottom:1px solid var(--line);text-align:right;
  font-variant-numeric:tabular-nums;color:var(--txt)}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom-color:transparent}
.sec-title{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--dim);
  letter-spacing:1.2px;margin:16px 0 8px;font-family:var(--mono)}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 9px;
  border-radius:999px;border:1px solid transparent;letter-spacing:.2px;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill-shipped{color:var(--ok);background:color-mix(in oklab,var(--ok) 14%,transparent);border-color:color-mix(in oklab,var(--ok) 30%,transparent)}
.pill-building{color:var(--warn);background:color-mix(in oklab,var(--warn) 15%,transparent);border-color:color-mix(in oklab,var(--warn) 32%,transparent)}
.pill-planned{color:var(--mut);border-color:var(--line2);background:var(--panel2)}
.pill-deprecated{color:var(--err);background:color-mix(in oklab,var(--err) 14%,transparent);border-color:color-mix(in oklab,var(--err) 30%,transparent)}
.pill-open{color:var(--err);background:color-mix(in oklab,var(--err) 14%,transparent);border-color:color-mix(in oklab,var(--err) 30%,transparent)}
.bugrow{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid transparent;
  border-radius:12px;background:var(--panel2);margin-bottom:6px}
.dotsev{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
.bugtitle{font-size:12.5px}
.bugmeta{color:var(--mut);font-size:10.5px;font-family:var(--mono)}
.empty{color:var(--dim);font-size:12px;padding:8px 0}
.tip{margin:0;padding-left:16px;color:var(--mut);font-size:12px}
.tip li{margin:4px 0}

/* 新建节点表单 */
#newform{position:fixed;z-index:60;left:50%;top:50%;translate:-50% -50%;width:340px;max-height:80vh;overflow:auto;
  background:var(--card-bg);border:1px solid var(--card-line);border-radius:16px;box-shadow:var(--card-shadow);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  padding:16px 18px;animation:modalPop .18s cubic-bezier(.16,1,.3,1);
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
@keyframes modalPop{from{opacity:0;scale:.96}to{opacity:1;scale:1}}
#newform.hidden,#draftbar.hidden{display:none}
#newform .nf-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#newform .nf-head b{font-size:14px;font-weight:600;flex:1}
#newform .nf-head select{width:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;
  color:var(--txt);padding:4px 10px;font:12px var(--sans);outline:none;cursor:pointer;transition:border-color .16s}
#newform .nf-head select:hover{border-color:var(--acc)}
#newform .nf-x{width:24px;height:24px;display:grid;place-items:center;color:var(--dim);font-size:15px;line-height:1;
  border-radius:8px;transition:.16s}
#newform .nf-x:hover{color:var(--txt);background:var(--panel2)}
.nf-row{margin:9px 0}
.nf-row>label{display:block;color:var(--mut);font-size:11px;font-weight:500;letter-spacing:.2px;margin-bottom:5px}
.nf-row input,.nf-row select,#newform textarea{width:100%;background:var(--panel2);border:1.5px solid transparent;
  color:var(--txt);border-radius:10px;padding:6px 10px;font:12.5px var(--sans);outline:none;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
.nf-row input:hover,.nf-row select:hover,#newform textarea:hover{border-color:var(--line2)}
.nf-row input:focus,.nf-row select:focus,#newform textarea:focus{border-color:var(--acc);box-shadow:var(--ring);background:var(--panel)}
.nf-row input::placeholder{color:var(--dim)}
#newform textarea{resize:vertical;min-height:58px;line-height:1.5;font-family:var(--sans)}
.nf-foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.nf-err{color:var(--err);font-size:11px;flex:1;line-height:1.4}
.nf-btn{padding:6px 16px;border:1px solid var(--line2);border-radius:999px;color:var(--txt);background:var(--panel);

.db-head::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;

.db-t{flex:1;min-width:0}

.db-k{color:var(--dim);font-size:11px;font-family:var(--mono)}
.db-s{color:var(--mut);font-size:11px;margin-top:2px}
.db-a{display:flex;gap:5px;flex:none}
.db-a button{font-size:11px;padding:3px 9px;border:1px solid var(--line2);border-radius:999px;color:var(--mut);

.db-a button:hover{color:var(--txt);border-color:var(--acc);background:var(--acc-soft)}
.db-foot{display:flex;gap:8px;margin-top:10px}
.draft-tag{fill:var(--warn);font:10px var(--mono)}
.fold-badge{fill:var(--dim);font-weight:600}
.ins-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;

.ins-row b{font-family:var(--mono);color:var(--txt)}

      fixFocusHidden();

      hintEl.textContent = '已撤下草稿 ' + id + '；正式数据请删 ' + dirOf(kind) + '/' + id + '.md';
      return;
    }
  }
  hintEl.textContent = 'md 是唯一真相：删除请删 loop/' + dirOf(kind) + '/' + id + '.md，再跑 queue map build';
}

/* ================= 视图状态 ================= */
var wrap = document.querySelector('.canvas-wrap');
var svg = document.getElementById('map');
var cardEl = document.getElementById('card');
var cardPos = {x:0, y:0};
var hintEl = document.getElementById('hint');
var PAD = {l:34, r:24, top:46, bottom:44};
var FULL = null;
function refreshSpan(){
  // 真实活动日 + 今天；项目 since 只作元信息，不再把默认窗口硬拉到项目起源。
  // 没有有效日期时兜底到今天（数据层总会给 TODAY，这里防手改模板）。
  var span = timelineSpan({ releases:RELEASES, features:FEATURES, bugs:BUGS, today:TODAY, since:PROJECT.since });
  if (!span){
    var t = Date.parse(TODAY + 'T00:00:00Z');
    if (!Number.isFinite(t)) t = Date.now();
    span = { t0:new Date(t - 11 * 864e5), t1:new Date(t + 11 * 864e5) };
  }
  FULL = span;
}
function refreshAll(){
  refreshStats(); refreshTree(); refreshSpan();
  HAS_PLAN = FEATURES.some(function(f){ return f.status === 'planned'; });
  if (typeof view !== 'undefined' && view){
    if (+view.t0 < +FULL.t0) view.t0 = new Date(+FULL.t0);
    if (+view.t1 > +FULL.t1) view.t1 = new Date(+FULL.t1);
    if (+view.t1 <= +view.t0){ view.t0 = new Date(+FULL.t0); view.t1 = new Date(+FULL.t1); }
  }
}
refreshAll();
var view = {t0: new Date(FULL.t0), t1: new Date(FULL.t1)};
var mix = 1;  // 0 = 顺序（只表先后），1 = 时间线（真实日期）
var focusId = null;   // 键盘焦点：TREE 节点 id（root / mod-x / 功能 id）
var NODE_GEOM = {};   // 渲染时记录的节点坐标（svg 坐标 → 空格开卡片用）
var collapsed = new Set();
var moved = false;
var viewMode = 'chart';                     // chart = 顺序/时间线；mind = 导图
var mindView = { tx: 40, ty: 40, k: 1 };     // 导图画布变换

function xOf(t){
  var plotW = wrap.clientWidth - PAD.l - PAD.r;
  return PAD.l + (t - view.t0) * plotW / (view.t1 - view.t0);
}
function clampSpan(ms){ return Math.max(22 * 864e5, Math.min(300 * 864e5, ms)); }

/* ================= 渲染 ================= */
function render(){
  var W = wrap.clientWidth, H = wrap.clientHeight;
  if (!W || !H) return;
  NODE_GEOM = {};
  var out = [];
  if (viewMode === 'mind'){
    svg.style.height = H + 'px';
    renderMind(W, H, out);
  } else {
    var plotW = W - PAD.l - PAD.r;
    var rows = [];
    TREE.children.forEach(function(m){ flatten(m, 1, rows); });
    var topPad = 88, bottomPad = 20;
    var rowH = Math.max(28, Math.min(46, (H - topPad - bottomPad) / rows.length));
    // 功能多于一屏时把 SVG 撑高，外层 canvas-wrap 纵向滚动；不再把 28px 以下的行挤没。
    H = Math.max(H, topPad + rows.length * rowH + bottomPad);
    svg.style.height = H + 'px';
    rows.forEach(function(r, i){ r.y = topPad + i * rowH + rowH / 2; });
    var rightEdge = W - PAD.r - 2;
    var plotBottom = H - bottomPad;
    var today = parseD(TODAY);

    renderChart(W, H, rows, rowH, out, plotW, plotBottom, rightEdge, today);
  }

  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = out.join('');
  svg.classList.toggle('pannable', viewMode === 'mind' || mix >= 0.5);
  svg.classList.toggle('mind-mode', viewMode === 'mind');
  ensureFocusedVisible();
}
// 键盘走树时，焦点节点不在可视区就滚过去（完整功能层超过一屏时必需）
function ensureFocusedVisible(){
  if (viewMode !== 'chart' || !focusId) return;
  var g = NODE_GEOM[focusId];
  if (!g) return;
  var top = wrap.scrollTop, bottom = top + wrap.clientHeight;
  if (g.y < top + 74){ wrap.scrollTop = Math.max(0, g.y - 74); }
  else if (g.y > bottom - 28){ wrap.scrollTop = g.y - wrap.clientHeight + 28; }
}

/* ---------- 树状模式 ---------- */
function renderChart(W, H, rows, rowH, out, plotW, plotBottom, rightEdge, today){
  var byId = {};
  rows.forEach(function(r){ byId[r.node.id] = r; });
  var gridTop = 42;
  var timeOn = mix > 0.05, orderOn = mix < 0.95;
  var tA = mix, oA = 1 - mix;

  // ---- 顺序布局 x（缩进 + 轻微先后错开）----
  var mods = TREE.children;
  var modRange = moduleDrift(mods.map(function(m){ return m.introduced || TODAY; }));
  var driftMax = Math.min(150, Math.max(70, plotW * 0.16));
  function modDrift(mid){
    var m = mods.find(function(x){ return x.id === mid; });
    if (!m) return 0;
    return driftRatio(m.introduced || TODAY, modRange) * driftMax;
  }
  function featDrift(f){
    var sibs = FEATURES.filter(function(x){ return x.module === f.module && !x.parent; });
    if (sibs.length < 2) return 0;
    var range = moduleDrift(sibs.map(fdate));
    return driftRatio(fdate(f), range) * Math.min(80, driftMax * 0.55);
  }
  var xo = {}, xt = {};
  rows.forEach(function(r){
    var n = r.node;
    if (n.kind === 'module'){
      xo[n.id] = PAD.l + 26 + modDrift(n.id);
      // 统一夹取到 [PAD.l+2, rightEdge]：模块和功能同一条规则，平移后谁也不会跑到父节点左侧
      var mraw = xOf(parseD(n.introduced || TODAY));
      xt[n.id] = Math.max(PAD.l + 2, Math.min(rightEdge, mraw));
    } else {
      var f = n.f;
      var pid = f.parent || 'mod-' + f.module;
      xo[n.id] = (xo[pid] != null ? xo[pid] : PAD.l + 44) + 18 + (f.parent ? 0 : featDrift(f));
      var raw = Math.max(PAD.l + 2, Math.min(rightEdge, xOf(parseD(fdate(f)))));
      xt[n.id] = raw;
    }
    r.x = xo[n.id] * oA + xt[n.id] * tA;
    r.xEarly = xo[n.id] < PAD.l + 30 && xt[n.id] <= PAD.l + 2;
    r.xFuture = mix > 0.5 && xt[n.id] >= rightEdge - 1;
  });

  // ---- 模块行底色 ----
  rows.forEach(function(r){
    if (r.node.kind === 'module'){
      out.push('<rect class="band" x="' + PAD.l + '" y="' + (r.y - rowH / 2) + '" width="' + plotW + '" height="' + rowH + '"/>');
    }
  });

  // ---- 时间侧装饰：日期尺 / 版本 / 今天（随 mix 淡入）----
  if (timeOn){
    var gT = [];
    var spanDays = (view.t1 - view.t0) / 864e5;
    var daily = spanDays <= 50;
    var hasToday = today >= view.t0 && today <= view.t1;
    var todayX = hasToday ? xOf(today) : -1e9;
    var lastLabelX = -1e9;
    var d = new Date(+view.t0);
    d = daily
      ? new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()))
      : new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
    while (d <= view.t1){
      if (d >= view.t0){
        var mx = xOf(d);
        gT.push('<line class="grid-line" x1="' + mx + '" y1="' + gridTop + '" x2="' + mx + '" y2="' + plotBottom + '"/>');
        var label = daily
          ? ((d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日')
          : (d.getUTCMonth() === 0 ? (d.getUTCFullYear() + '年') : ((d.getUTCMonth() + 1) + '月'));
        if (mx - lastLabelX >= 62 && Math.abs(mx - todayX) > 58){
          gT.push('<text class="axis-text" x="' + mx + '" y="' + (gridTop - 8) + '" text-anchor="middle">' + label + '</text>');
          lastLabelX = mx;
        }
      }
      d = new Date(+d);
      if (daily) d.setUTCDate(d.getUTCDate() + 1);
      else d.setUTCMonth(d.getUTCMonth() + 1);
    }
    if (hasToday){
      gT.push('<line class="today-line" x1="' + todayX + '" y1="' + gridTop + '" x2="' + todayX + '" y2="' + plotBottom + '"/>');
      gT.push('<text class="axis-text today" x="' + todayX + '" y="' + (gridTop - 8) + '" text-anchor="middle">今天</text>');
      if (HAS_PLAN && todayX < W - PAD.r){
        gT.push('<rect class="plan-band" x="' + todayX + '" y="' + gridTop +
          '" width="' + (W - PAD.r - todayX) + '" height="' + (plotBottom - gridTop) + '"/>');
        var pw = 56;
        gT.push('<rect class="rel-pill" x="' + (W - PAD.r - pw - 2) + '" y="4" width="' + pw + '" height="18" rx="9"/>' +
          '<text class="rel-tag" x="' + (W - PAD.r - pw / 2 - 2) + '" y="17" text-anchor="middle">计划区</text>');
      }
    }
    RELEASES.forEach(function(rel){
      var rd = parseD(rel.date);
      if (rd < view.t0 || rd > view.t1) return;
      var rx = xOf(rd);
      var px = Math.max(PAD.l + 26, Math.min(W - PAD.r - 26, rx));
      gT.push('<line class="rel-line" x1="' + rx + '" y1="' + gridTop + '" x2="' + rx + '" y2="' + plotBottom + '"/>');
      gT.push('<g class="hit rel-hit" data-kind="release" data-id="' + rel.v + '">' +
        '<rect class="rel-pill" x="' + (px - 25) + '" y="4" width="50" height="18" rx="9"/>' +
        '<text class="rel-tag" x="' + px + '" y="17" text-anchor="middle">' + rel.v + '</text>' +
        '<title>' + rel.v + ' · ' + rel.date + '</title></g>');
    });
    out.push('<g opacity="' + tA.toFixed(2) + '">' + gT.join('') + '</g>');
  }

  // ---- 根盒子 + 主干 ----
  var rootTxt = PROJECT.name + ' 项目';
  var boxH = 26, boxY = gridTop + 5;
  var boxW = Math.round(approxTextW(rootTxt, 13) + 24);
  var rootX = PAD.l + 13;
  out.push('<g class="hit' + (focusId === 'root' ? ' focused' : '') + '" data-kind="root">' +
    '<rect class="root-box" x="' + PAD.l + '" y="' + boxY + '" width="' + boxW + '" height="' + boxH + '" rx="10"/>' +
    (focusId === 'root' ? '<rect class="focus-ring" x="' + (PAD.l - 4) + '" y="' + (boxY - 4) +
      '" width="' + (boxW + 8) + '" height="' + (boxH + 8) + '" rx="12"/>' : '') +
    '<text class="root-label" x="' + (PAD.l + 12) + '" y="' + (boxY + 17.5) + '">' + esc(rootTxt) + '</text></g>');
  NODE_GEOM.root = { x: PAD.l + boxW / 2, y: boxY + boxH / 2 };
  if (rows.length){
    out.push('<line class="spine" x1="' + rootX + '" y1="' + (boxY + boxH) + '" x2="' + rootX + '" y2="' + rows[rows.length - 1].y + '"/>');
  }

  // ---- 树状连接线（父 → 子，肘形）----
  rows.forEach(function(r){
    var n = r.node;
    if (n.kind === 'module'){
      out.push('<path class="link" d="M' + rootX + ',' + r.y + ' H' + r.x + '"/>');
      return;
    }
    var f = n.f;
    var pid = f.parent || 'mod-' + f.module;
    var p = byId[pid];
    if (!p || r.xEarly) return;
    out.push('<path class="link" d="' + elbow(p.x, p.y, r.x, r.y) + '"/>');
  });

  // ---- 行：节点 + 存活/Bug 泳道（时间侧） + 标签 ----
  rows.forEach(function(r){
    var n = r.node;
    var y = r.y;
    var isModule = n.kind === 'module';
    var x = r.x;

    if (isModule){
      var modFold = n.children.length > 0;
      var mFoc = focusId === n.id;
      var mFlip = x + 10 + approxTextW(n.title, 12.5) > rightEdge;
      var mAnchor = mFlip ? 'end' : 'start';
      var mLabelX = mFlip ? x - 10 : x + 10;
      NODE_GEOM[n.id] = { x: x, y: y };
      out.push('<g class="hit' + (mFoc ? ' focused' : '') + '" data-kind="module" data-id="' + n.m.id + '">' +
        '<circle class="mod-dot" cx="' + x + '" cy="' + y + '" r="4.5"' +
        (modFold ? ' data-toggle="' + n.id + '"' : '') + '/>' +
        (modFold && collapsed.has(n.id)
          ? '<circle class="dot-ring" cx="' + x + '" cy="' + y + '" r="8" style="stroke:var(--mod-dot)"/>'
          : '') +
        (mFoc ? '<circle class="focus-ring" cx="' + x + '" cy="' + y + '" r="9.5"/>' : '') +
        '<text class="mod-label" x="' + mLabelX + '" y="' + (y + 4) + '" text-anchor="' + mAnchor + '">' + esc(n.title) + '</text>' +
        '<title>' + esc(n.title) + ' · ' + n.children.length + ' 个功能' + (modFold ? '（点圆点折叠）' : '') + '</title></g>');
      return;
    }

    var f = n.f;
    var laneY = y + 12;
    var endX = Math.min(xOf(f.deprecated ? parseD(f.deprecated) : today), W - PAD.r);
    var hasKids = n.children.length > 0;
    var flip = x + 8 + approxTextW(f.title, f.parent ? 11.5 : 12) + (hasKids ? 34 : 0) > rightEdge;
    var anchor = flip ? 'end' : 'start';
    var labelX = flip ? x - 8 : x + 8;
    var fFoc = focusId === n.id;
    NODE_GEOM[n.id] = { x: x, y: y };

    out.push('<g class="hit' + (fFoc ? ' focused' : '') + '" data-kind="feature" data-id="' + f.id + '"' +
      (r.xFuture ? ' opacity="0.32"' : '') + '>');
    out.push('<rect class="rowbg' + (fFoc ? ' rowactive' : '') + '" x="' + PAD.l + '" y="' + (y - rowH / 2) + '" width="' + plotW + '" height="' + rowH + '"/>');
    if (timeOn && mix > 0.15){
      var lane = [];
      if (f.status === 'planned'){
        var nowX = xOf(today);
        var la = Math.max(PAD.l, Math.min(nowX, x)), lb = Math.min(W - PAD.r, Math.max(nowX, x));
        if (lb - la > 4){
          lane.push('<line class="life plan" x1="' + la + '" y1="' + laneY + '" x2="' + lb + '" y2="' + laneY +
            '" stroke="' + STATUS_COLOR.planned + '"/>');
        }
      } else if (endX > xt[f.id] * tA + x * oA){
        lane.push('<line class="life' + (f.deprecated ? ' dep' : '') + '" x1="' + x + '" y1="' + laneY +
          '" x2="' + endX + '" y2="' + laneY + '" stroke="' + STATUS_COLOR[f.status] + '"/>');
      }
      bugsOf(f.id).forEach(function(b){
        var bx = xo[f.id] * oA + xOf(parseD(b.reported)) * tA;
        if (bx < PAD.l || bx > W - PAD.r) return;
        lane.push('<g class="hit" data-kind="bug" data-id="' + b.id + '">' +
          '<circle class="bug-dot ' + (b.fixed ? 'fixed' : 'open') + '" cx="' + bx + '" cy="' + laneY + '" r="3.2"/>' +
          '<title>' + b.id + ' · ' + esc(b.title) + ' · ' + b.reported +
          (b.fixed ? (' → ' + b.fixed) : ' · 未修') + '</title></g>');
      });
      if (lane.length) out.push('<g opacity="' + Math.min(1, (mix - 0.15) / 0.5).toFixed(2) + '">' + lane.join('') + '</g>');
    }
    out.push('<circle class="feat-dot' + (f.status === 'planned' ? ' plan' : '') + '" cx="' + x + '" cy="' + y + '" r="4"' +
      ' fill="' + (f.status === 'planned' ? 'none' : STATUS_COLOR[f.status]) + '"' +
      (f.status === 'planned' ? ' style="stroke:' + STATUS_COLOR.planned + ';stroke-dasharray:2.4 2"' : '') +
      (hasKids ? ' data-toggle="' + f.id + '"' : '') + '/>');
    if (fFoc) out.push('<circle class="focus-ring" cx="' + x + '" cy="' + y + '" r="8.5"/>');
    if (hasKids && collapsed.has(f.id)){
      out.push('<circle class="dot-ring" cx="' + x + '" cy="' + y + '" r="7.5" style="stroke:' + STATUS_COLOR[f.status] + '"/>');
    }
    var badge = (hasKids && collapsed.has(f.id)) ? ' <tspan class="fold-badge">+' + descendants(n) + '</tspan>' : '';
    if (f.__draft) badge += ' <tspan class="draft-tag">草稿</tspan>';
    out.push('<text class="feat-label' + (f.parent ? ' child' : '') + '" x="' + labelX + '" y="' + (y + 4) +
      '" text-anchor="' + anchor + '">' + (r.xEarly ? '‹ ' : '') + esc(f.title) + badge + '</text>');
    out.push('<title>' + esc(f.title) + ' · ' + STATUS_LABEL[f.status] + ' · ' + (f.introduced || f.target) +
      ' · 修改点 ' + bugsOf(f.id).length + (hasKids ? '（点圆点折叠）' : '') + '</title></g>');
  });

  // ---- 顺序侧右列（日期 / Bug 数，随 mix 淡出）----
  if (orderOn){
    var gO = [];
    rows.forEach(function(r){
      var n = r.node;
      var y = r.y;
      var meta = n.kind === 'module'
        ? (n.children.length + ' 个功能 · 修改点 ' + n.children.reduce(function(s, c){ return s + countBugs(c); }, 0))
        : ((n.f.introduced || n.f.target) + ' · 修改点 ' + bugsOf(n.id).length);
      gO.push('<text class="tree-meta" x="' + (W - PAD.r) + '" y="' + (y - 8) + '" text-anchor="end">' + meta + '</text>');
    });
    out.push('<g opacity="' + oA.toFixed(2) + '">' + gO.join('') + '</g>');
  }
}
function countBugs(node){
  return bugsOf(node.id).length + node.children.reduce(function(s, c){ return s + countBugs(c); }, 0);
}
function elbow(px, py, cx, cy){
  if (Math.abs(cy - py) < 1) return 'M' + px + ',' + py + ' H' + cx;
  var dir = cy > py ? 1 : -1;
  var rr = Math.min(10, Math.abs(cy - py) / 2);
  if (cx < px + rr) return 'M' + px + ',' + py + ' V' + cy + ' H' + cx;
  return 'M' + px + ',' + py + ' V' + (cy - dir * rr) +
    ' Q' + px + ',' + cy + ' ' + (px + rr) + ',' + cy + ' H' + cx;
}

/* ================= 导图模式 ================= */
/* 布局纯函数：可见节点 → tidy-tree 坐标（右单向，根在左，模块间留白） */
var MIND_NH = { root: 46, module: 34, feature: 44 };
var MIND_PX = 13;   // 节点内左右留白
function layoutMind(){
  var VGAP = 10, MODGAP = 26, LGAP = 72;
  var nodes = [];
  (function walk(n, depth, parent){
    var o = { id: n.id, kind: n.kind, depth: depth, parent: parent, node: n, children: [] };
    nodes.push(o);
    if (!collapsed.has(n.id)) n.children.forEach(function(c){ o.children.push(walk(c, depth + 1, o)); });
    return o;
  })(TREE, 0, null);
  var root = nodes[0];

  nodes.forEach(function(o){
    var title = o.kind === 'root' ? (PROJECT.name + ' 项目') : o.node.title;
    var px = o.kind === 'root' ? 14 : o.kind === 'module' ? 13 : 12.5;
    var w = Math.round(approxTextW(title, px)) + MIND_PX * 2;
    o.h = MIND_NH[o.kind];
    o.foldN = (o.node.children.length && !o.children.length) ? descendants(o.node) : 0;
    if (o.foldN) w += 32;
    if (o.kind === 'feature'){
      var f = o.node.f;
      w += 14;                                   // 状态点位置
      var bs = bugsOf(f.id);
      if (bs.length){
        o.bugTxt = (bs.length - openOf(f.id).length) + '/' + bs.length;
        w += approxTextW(o.bugTxt, 10) + 12;
      }
      if (f.__draft) w += 30;
      // 日期行（日期 · Bug 角标）可能比标题行宽，不能溢出右缘
      var dateW = approxTextW(f.introduced || f.target || '', 9.5);
      if (o.bugTxt) dateW += approxTextW(' · ●' + o.bugTxt, 10) + 8;
      w = Math.max(w, 26 + dateW + MIND_PX);
    }
    o.w = Math.max(w, 58);
  });

  var colW = [];
  nodes.forEach(function(o){ colW[o.depth] = Math.max(colW[o.depth] || 0, o.w); });
  var colX = [], xEnd = 0;
  for (var d = 0; d < colW.length; d++){
    if (colW[d] == null) continue;
    colX[d] = xEnd;
    xEnd += colW[d] + LGAP;
  }
  nodes.forEach(function(o){ o.x = colX[o.depth] || 0; });

  var cur = 0;
  (function place(o){
    if (!o.children.length){ o.y = cur + o.h / 2; cur += o.h + VGAP; return; }
    o.children.forEach(function(c, i){
      if (i && o.depth === 0) cur += MODGAP;   // 模块之间的呼吸感
      place(c);
    });
    o.y = (o.children[0].y + o.children[o.children.length - 1].y) / 2;
  })(root);

  return { nodes: nodes, root: root, bw: xEnd - LGAP, bh: cur };
}

function mindNodeSVG(o){
  var n = o.node, x = o.x, y = o.y, w = o.w, h = o.h;
  var foc = focusId === o.id;
  var g = '<g class="hit mnode' + (foc ? ' focused' : '') + '" data-kind="' + o.kind + '"';
  if (o.kind === 'module') g += ' data-id="' + n.m.id + '"';
  if (o.kind === 'feature') g += ' data-id="' + n.f.id + '"';
  g += '>';
  var s = '';
  var tog = o.node.children.length ? ' data-toggle="' + o.id + '"' : '';

  if (o.kind === 'root'){
    s += '<rect class="mroot-box" x="' + x + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="12"/>' +
      '<text class="root-label" x="' + (x + MIND_PX) + '" y="' + (y + 5) + '">' + esc(n.title) + ' 项目</text>';
  } else if (o.kind === 'module'){
    s += '<rect class="mmod-box" x="' + x + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="9"/>' +
      '<circle class="mod-dot" cx="' + (x + 14) + '" cy="' + y + '" r="4.5"' + tog + '/>' +
      (o.foldN ? '<circle class="dot-ring" cx="' + (x + 14) + '" cy="' + y + '" r="8" style="stroke:var(--mod-dot)"/>' : '') +
      '<text class="mod-label" x="' + (x + 26) + '" y="' + (y + 4.5) + '">' + esc(n.title) +
      (o.foldN ? ' <tspan class="fold-badge">+' + o.foldN + '</tspan>' : '') +
      (n.m.__draft ? ' <tspan class="draft-tag">草稿</tspan>' : '') + '</text>';
  } else {
    var f = n.f;
    var dotFill = f.status === 'planned' ? 'none' : STATUS_COLOR[f.status];
    var dotStyle = f.status === 'planned' ? ' style="stroke:' + STATUS_COLOR.planned + ';stroke-dasharray:2.4 2"' : '';
    var kids = o.node.children.length;
    s += '<rect class="mfeat-box" x="' + x + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="10"/>' +
      '<circle class="feat-dot' + (f.status === 'planned' ? ' plan' : '') + '" cx="' + (x + 14) + '" cy="' + (y - 3) + '" r="4"' +
      ' fill="' + dotFill + '"' + dotStyle + (kids ? ' data-toggle="' + o.id + '"' : '') + '/>' +
      (o.foldN ? '<circle class="dot-ring" cx="' + (x + 14) + '" cy="' + (y - 3) + '" r="7.5" style="stroke:' + STATUS_COLOR[f.status] + '"/>' : '') +
      '<text class="feat-label' + (f.parent ? ' child' : '') + '" x="' + (x + 26) + '" y="' + (y + 0) + '">' + esc(f.title) +
      (o.foldN ? ' <tspan class="fold-badge">+' + o.foldN + '</tspan>' : '') +
      (f.__draft ? ' <tspan class="draft-tag">草稿</tspan>' : '') + '</text>' +
      '<text class="mdate" x="' + (x + 26) + '" y="' + (y + 14) + '">' + (f.introduced || f.target || '') +
      (o.bugTxt ? ' · <tspan style="fill:' + (openOf(f.id).length ? 'var(--err)' : 'var(--dim)') +
        ';font-weight:600">●' + o.bugTxt + '</tspan>' : '') + '</text>';
  }
  if (foc) s += '<rect class="focus-ring" x="' + (x - 4) + '" y="' + (y - h / 2 - 4) + '" width="' + (w + 8) + '" height="' + (h + 8) + '" rx="12"/>';
  return g + s + '</g>';
}

function renderMind(W, H, out){
  var lay = layoutMind();
  var t = mindView;
  out.push('<g transform="translate(' + t.tx.toFixed(1) + ',' + t.ty.toFixed(1) + ') scale(' + t.k.toFixed(3) + ')">');
  lay.nodes.forEach(function(o){
    if (!o.parent) return;
    var p = o.parent;
    var px = p.x + p.w, py = p.y, cx = o.x, cy = o.y, dx = (cx - px) / 2;
    out.push('<path class="mlink" d="M' + px + ',' + py + ' C' + (px + dx) + ',' + py +
      ' ' + (cx - dx) + ',' + cy + ' ' + cx + ',' + cy + '"/>');
  });
  lay.nodes.forEach(function(o){ out.push(mindNodeSVG(o)); });
  out.push('</g>');
  lay.nodes.forEach(function(o){
    NODE_GEOM[o.id] = { x: t.tx + (o.x + o.w / 2) * t.k, y: t.ty + o.y * t.k };
  });
}

function fitMind(){
  var W = wrap.clientWidth, H = wrap.clientHeight;
  if (!W || !H) return;
  var lay = layoutMind();
  var k = Math.min((W - 100) / Math.max(lay.bw, 1), (H - 100) / Math.max(lay.bh, 1), 1.15);
  mindView.k = Math.max(0.25, k);
  mindView.tx = (W - lay.bw * mindView.k) / 2;
  mindView.ty = (H - lay.bh * mindView.k) / 2;
}

function setMode(m){
  viewMode = m;
  closeCard();
  applyChrome();
  if (m === 'mind') fitMind();
  render();
}

function collapseAllNodes(){

    if (n.children.length) collapsed.add(n.id);

}
function zoomTo(dateStr, before, after){

  render();
}

function cardAccent(kind, id){
  if (kind === 'feature'){ var f = featById(id); return f ? STATUS_COLOR[f.status] : 'var(--acc)'; }
  if (kind === 'bug'){ var b = BUGS.find(function(x){ return x.id === id; }); return b ? SEV_COLOR[b.severity] : 'var(--err)'; }
  return 'var(--acc)';
}
function openCard(kind, id, x, y){

  cardPos = {x:x, y:y};
  cardEl.innerHTML = html;
  cardEl.style.setProperty('--card-acc', cardAccent(kind, id));
  cardEl.classList.add('open');
  var w = cardEl.offsetWidth, h = cardEl.offsetHeight;
  var left = x + 14, top = y + 14;
  if (left + w > innerWidth - 10) left = Math.max(10, x - w - 14);
  if (top + h > innerHeight - 10) top = Math.max(56, y - h - 14);
  cardEl.style.left = left + 'px';
  cardEl.style.top = top + 'px';
}
function closeCard(){
  cardEl.classList.remove('open');
  cardEl.innerHTML = '';
  // 卡片里的按钮可能还搭着焦点，不清掉会吃掉后续键盘事件
  var ae = document.activeElement;

cardEl.addEventListener('click', function(e){
  if (e.target.closest('[data-close]')){ closeCard(); return; }
  var gb = e.target.closest('[data-goto-bug]');
  if (gb){ openCard('bug', gb.dataset.gotoBug, cardPos.x, cardPos.y); return; }
  var gf = e.target.closest('[data-goto-feature]');
  if (gf){
    var fid = gf.dataset.gotoFeature;
    focusId = fid; render();
    openCard('feature', fid, cardPos.x, cardPos.y);
    return;
  }
  var a = e.target.closest('[data-action]');
  if (!a) return;
  var act = a.dataset.action, id = a.dataset.id;
  if (act === 'toggle-kids'){ toggle(id); openCard('feature', id, cardPos.x, cardPos.y); }
  else if (act === 'toggle-module'){ toggle('mod-' + id); openCard('module', id, cardPos.x, cardPos.y); }
  else if (act === 'focus-time'){
    var f = featById(id);
    if (viewMode === 'mind') setMode('chart');
    if (mix < 1) setMix(1);
    focusId = id; render();
    zoomTo(fdate(f), 15, 75);
    closeCard();
  }
  else if (act === 'goto-feature'){ focusId = id; render(); openCard('feature', id, cardPos.x, cardPos.y); }
  else if (act === 'zoom-release'){
    zoomTo(RELEASES.find(function(r){ return r.v === id; }).date, 20, 40);
    closeCard();
  }
  else if (act === 'expand-all'){ collapsed.clear(); render(); openCard('root', null, cardPos.x, cardPos.y); }
  else if (act === 'collapse-all'){ collapseAllNodes(); closeCard(); }
});

svg.addEventListener('click', function(e){

var dragging = false, dragStart = null;
svg.addEventListener('pointerdown', function(e){
  if (e.button !== 0) return;
  if (viewMode !== 'mind' && mix < 0.5) return;
  dragging = true; moved = false;
  dragStart = viewMode === 'mind'
    ? {x: e.clientX, y: e.clientY, tx: mindView.tx, ty: mindView.ty}
    : {x: e.clientX, t0: +view.t0, t1: +view.t1};
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', function(e){
  if (!dragging) return;
  var dx = e.clientX - dragStart.x;
  if (viewMode === 'mind'){
    var dy = e.clientY - dragStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (!moved) return;
    if (cardEl.classList.contains('open')) closeCard();
    mindView.tx = dragStart.tx + dx;
    mindView.ty = dragStart.ty + dy;
    render();
    return;
  }
  if (Math.abs(dx) > 3) moved = true;
  if (!moved) return;
  if (cardEl.classList.contains('open')) closeCard();
  var plotW = wrap.clientWidth - PAD.l - PAD.r;
  var dt = -dx * (dragStart.t1 - dragStart.t0) / plotW;
  view.t0 = new Date(dragStart.t0 + dt);
  view.t1 = new Date(dragStart.t1 + dt);
  render();
});
function endDrag(){ dragging = false; svg.classList.remove('dragging'); }
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

svg.addEventListener('wheel', function(e){
  if (viewMode === 'mind'){
    e.preventDefault();
    if (cardEl.classList.contains('open')) closeCard();
    var rect = svg.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var k2 = Math.max(0.25, Math.min(3, mindView.k * (e.deltaY > 0 ? 0.88 : 1 / 0.88)));
    mindView.tx = mx - (mx - mindView.tx) * k2 / mindView.k;
    mindView.ty = my - (my - mindView.ty) * k2 / mindView.k;
    mindView.k = k2;
    render();
    return;
  }
  if (mix < 0.5) return;
  // 功能层超过一屏：普通滚轮纵向滚动；Ctrl/⌘ + 滚轮才缩放时间轴。
  var scrollable = svg.getBoundingClientRect().height > wrap.clientHeight + 1;
  if (scrollable && !e.ctrlKey && !e.metaKey && Math.abs(e.deltaY) >= Math.abs(e.deltaX)) return;
  e.preventDefault();
  if (cardEl.classList.contains('open')) closeCard();
  var rect2 = svg.getBoundingClientRect();
  var mx2 = e.clientX - rect2.left;
  var plotW = wrap.clientWidth - PAD.l - PAD.r;
  var fx = Math.max(0, Math.min(1, (mx2 - PAD.l) / plotW));
  var span = view.t1 - view.t0;
  var newSpan = clampSpan(span * (e.deltaY > 0 ? 1.18 : 1 / 1.18));
  var anchor = +view.t0 + fx * span;
  var t0 = anchor - fx * newSpan;
  view.t0 = new Date(t0); view.t1 = new Date(t0 + newSpan);
  render();
}, {passive:false});

window.addEventListener('keydown', function(e){
  var ae = document.activeElement;
  var inForm = ae && ae.closest && ae.closest('#newform');
  if (e.key === 'Escape'){
    // 分层退出：先关表单，再关卡片，最后才清地图焦点
    var nfEl = document.getElementById('newform');
    if (nfEl && !nfEl.classList.contains('hidden')){ closeNewForm(); return; }
    if (cardEl.classList.contains('open')){ closeCard(); return; }
    if (focusId){ focusId = null; render(); }
    return;
  }
  if (inForm){
    if (e.key === 'Enter' && ae.tagName !== 'TEXTAREA') saveNewForm();
    return;  // 表单开着：其余按键交给输入框
  }
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (!TREE || !navRows().length) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); navMove(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); navMove(-1); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); navInto(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); navOut(); }
  else if (e.key === 'Tab'){
    e.preventDefault();
    if (!focusId){ focusId = 'root'; render(); }
    openNewForm(presetForCreate('child'));
  }
  else if (e.key === 'Enter'){
    e.preventDefault();
    if (!focusId){ focusId = 'root'; render(); }
    openNewForm(presetForCreate('sibling'));
  }
  else if (e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); openFocusedCard(); }
  else if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteFocused(); }
  else if (e.key === 'm' || e.key === 'M'){ setMode(viewMode === 'mind' ? 'chart' : 'mind'); }
});

/* ================= 页内新建节点（写回 md） ================= */
var DRAFT_KEY = 'pmap-drafts::' + PROJECT.name;
var DRAFTS = [];
var dirHandle = null;
var NF_KIND = 'feature', NF_VALUES = {}, NF_ERR = '';
var KIND_LABEL = {feature:'功能点', bug:'修改点', module:'模块', release:'版本'};
// 修改点 = loop 工作项：类型决定门链（清单由引擎注入），严重度走 loop 的 S0..S3，显示时映射成 4 档颜色
var TYPE_LABEL = {bug:'bug 缺陷', 'fix-small':'fix-small 小修', docs:'docs 文档', chore:'chore 杂务', question:'question 问答',
  feature:'feature 功能', redesign:'redesign 重设计', 'new-surface':'new-surface 新界面', arch:'arch 架构'};
var SEV2PMAP = {S0:'critical', S1:'high', S2:'normal', S3:'low'};

function todayStr(){
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function arrOf(kind){ return kind === 'feature' ? FEATURES : kind === 'bug' ? BUGS : kind === 'module' ? MODULES : RELEASES; }
function idFieldOf(kind){ return kind === 'release' ? 'v' : 'id'; }
// 落点（相对消费者仓库根）：功能层在 loop/map/**，修改点写进 loop/items/（工作项 md）
function dirOf(kind){ return kind === 'feature' ? 'map/features' : kind === 'bug' ? 'items' : kind === 'module' ? 'map/modules' : 'map/releases'; }
function loadDrafts(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || '[]'); } catch (e){ return []; } }
function saveDrafts(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(DRAFTS)); } catch (e){} }

// 把浏览器里存的草稿并回数据；已经进了 md（被 build 进数据）的草稿自动丢掉
function injectDrafts(){
  var keep = [];
  DRAFTS.forEach(function(d){
    var arr = arrOf(d.kind), idf = idFieldOf(d.kind);
    if (arr.some(function(x){ return x[idf] === d.data[idf]; })) return;
    d.data.__draft = true;
    arr.push(d.data);
    keep.push(d);
  });
  DRAFTS = keep;
  saveDrafts();
}

var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function badDate(s){ if (!DATE_RE.test(s || '')) return true; var d = new Date(s + 'T00:00:00Z'); return isNaN(+d) || d.toISOString().slice(0, 10) !== s; }
function slugOk(s){ return /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(s || ''); }

function validateNew(kind, v){
  var e = [], idf = idFieldOf(kind), id = v[idf];
  if (!id) e.push(kind === 'release' ? '版本号不能为空' : 'id 不能为空');
  else if (!slugOk(id)) e.push('id 只能用字母、数字、. _ -，以字母或数字开头');
  else if (arrOf(kind).some(function(x){ return x[idf] === id; })) e.push('id “' + id + '” 已存在');
  if (kind !== 'release' && !(v.title || '').trim()) e.push('标题不能为空');
  if (kind === 'release' && badDate(v.date)) e.push('日期要写 YYYY-MM-DD');
  if (kind === 'feature'){
    if (!MODULES.some(function(m){ return m.id === v.module; })) e.push('先选一个模块');
    if (v.parent && !FEATURES.some(function(f){ return f.id === v.parent; })) e.push('父功能不存在');
    if (v.parent === v.id) e.push('父功能不能是自己');
    if (v.status === 'planned'){
      if (badDate(v.target)) e.push('计划上线日要写 YYYY-MM-DD');
      if (v.target && v.target < TODAY) e.push('计划日已经早于今天（' + TODAY + '）');
    } else if (badDate(v.introduced)) e.push('实现日要写 YYYY-MM-DD');
  }
  if (kind === 'bug'){
    // 修改点写进 loop/items/<id>.md（工作项 md）：类型决定门链，优先级决定开工顺序
    if (!FEATURES.filter(function(f){ return f.id !== '_orphan'; }).some(function(f){ return f.id === v.feature; })) e.push('先选所属功能点（没有功能点就先建一个）');
    if (LOOP_TYPES.indexOf(v.type) < 0) e.push('类型必须是 ' + LOOP_TYPES.join(' / '));
    if (LOOP_PRIORITIES.indexOf(v.priority) < 0) e.push('优先级必须是 ' + LOOP_PRIORITIES.join(' / '));
    if (LOOP_SEVERITIES.indexOf(v.severity) < 0) e.push('严重度必须是 ' + LOOP_SEVERITIES.join(' / '));
  }
  return e;
}

function toRecord(kind, v){
  if (kind === 'feature'){
    var planned = v.status === 'planned';
    var rec = { id:v.id, title:v.title.trim(), module:v.module, parent:(v.parent || null), status:v.status, releases: [] };
    if (planned) rec.target = v.target; else rec.introduced = v.introduced;
    if (v.note && v.note.trim()) rec.note = v.note.trim();
    return rec;
  }
  if (kind === 'bug'){
    // 图上渲染要 pmap 形状（severity/reported/fixed）；写盘要 loop 工作项字段（loopType/loopPriority/loopSeverity）
    var b = { id:v.id, title:v.title.trim(), feature:v.feature, severity:SEV2PMAP[v.severity] || 'normal',
      reported:todayStr(), fixed:null, fixedIn:null,
      loopType:v.type, loopPriority:v.priority, loopSeverity:v.severity };
    if (v.note && v.note.trim()) b.note = v.note.trim();
    return b;
  }
  if (kind === 'module') return { id:v.id, title:v.title.trim(), order:Number(v.order) || (MODULES.length + 1) };
  return { v:v.v, date:v.date };
}

function yv(x){
  if (x === null || x === undefined || x === '') return 'null';
  var s = String(x);
  return /[#]/.test(s) || /^\s|\s$/.test(s) ? JSON.stringify(s) : s;
}
function mdOf(kind, d){
  var L = ['---'];
  if (kind === 'feature'){
    L.push('id: ' + yv(d.id), 'title: ' + yv(d.title), 'module: ' + yv(d.module), 'parent: ' + yv(d.parent), 'status: ' + yv(d.status));
    if (d.status === 'planned') L.push('target: ' + yv(d.target)); else L.push('introduced: ' + yv(d.introduced));
    L.push('releases: []');
  } else if (kind === 'bug'){
    // 修改点 = loop 工作项：字段名走 loop 的 item 约定，正文固定四小节（RUNBOOK §11）
    var note = (d.note || '').trim() || '（地图页内新建，待补背景）';
    L.push('id: ' + yv(d.id), 'title: ' + yv(d.title), 'type: ' + yv(d.loopType || 'fix-small'),
      'priority: ' + yv(d.loopPriority || 'P2'), 'severity: ' + yv(d.loopSeverity || 'S2'),
      'status: open', 'origin: self', 'source: ' + yv('map 页内新建 ' + d.reported),
      'order: 100', 'feature: ' + yv(d.feature), 'createdAt: ' + yv(d.reported + 'T00:00:00.000Z'),
      '---', '', '# ' + d.title, '',
      '## 背景', '', note, '',
      '## 来源', '', '- self：项目地图页内新建 ' + d.reported, '',
      '## 验收判据', '', '_（待补：命令 → 期望数字）_', '',
      '## 记录', '', '_（待补）_', '');
    return L.join('\n');
  } else if (kind === 'module'){
    L.push('id: ' + yv(d.id), 'title: ' + yv(d.title), 'order: ' + yv(d.order));
  } else {
    L.push('v: ' + yv(d.v), 'date: ' + yv(d.date));
  }
  L.push('---', '');
  if (d.note) L.push(d.note);
  return L.join('\n') + '\n';
}
function fileNameOf(kind, d){ return (kind === 'release' ? d.v : d.id) + '.md'; }

/* ---- 表单 ---- */
function defaultsFor(kind){
  var t = todayStr();
  if (kind === 'feature') return {id:'', title:'', module:(MODULES[0] || {}).id || '', parent:'', status:'shipped', introduced:t, target:'', note:''};
  if (kind === 'bug') return {id:'', title:'', feature:(FEATURES.filter(function(f){ return f.id !== '_orphan'; })[0] || {}).id || '', type:'fix-small', priority:'P2', severity:'S2', note:''};
  if (kind === 'module') return {id:'', title:'', order:String(MODULES.length + 1), note:''};
  return {v:'', date:t, note:''};
}
function readForm(){
  var el = document.getElementById('newform');
  if (!el) return;
  el.querySelectorAll('[data-nf]').forEach(function(i){ NF_VALUES[i.dataset.nf] = i.value; });
  var k = el.querySelector('#nf-kind');
  if (k) NF_KIND = k.value;
}
function fld(label, key, type, extra){
  return '<div class="nf-row"><label>' + label + '</label><input data-nf="' + key + '" type="' + (type || 'text') +
    '" value="' + esc(NF_VALUES[key] || '') + '"' + (extra || '') + '></div>';
}
function sel(label, key, opts){
  return '<div class="nf-row"><label>' + label + '</label><select data-nf="' + key + '">' +
    opts.map(function(o){ return '<option value="' + esc(o.v) + '"' + (String(NF_VALUES[key]) === String(o.v) ? ' selected' : '') + '>' + esc(o.t) + '</option>'; }).join('') +
    '</select></div>';
}
function renderNewForm(){
  var el = document.getElementById('newform');
  var kind = NF_KIND;
  var h = '<div class="nf-head"><b>新建</b><select id="nf-kind">' +
    ['feature', 'bug', 'module', 'release'].map(function(k){
      return '<option value="' + k + '"' + (k === kind ? ' selected' : '') + '>' + KIND_LABEL[k] + '</option>';
    }).join('') + '</select><button class="nf-x" data-nf-act="close" aria-label="关闭">×</button></div><div class="nf-body">';

  if (kind === 'feature'){
    h += fld('标题', 'title');
    h += fld('id', 'id', 'text', ' placeholder="如 session-persist"');
    h += sel('模块', 'module', MODULES.map(function(m){ return {v:m.id, t:m.title}; }));
    h += sel('父功能', 'parent', [{v:'', t:'（无，挂在模块下）'}].concat(FEATURES.map(function(f){ return {v:f.id, t:f.title}; })));
    h += sel('状态', 'status', [{v:'shipped',t:'已发布'},{v:'building',t:'开发中'},{v:'planned',t:'计划中'},{v:'deprecated',t:'已废弃'}]);
    h += (NF_VALUES.status === 'planned') ? fld('计划上线日', 'target', 'date') : fld('实现日', 'introduced', 'date');
  } else if (kind === 'bug'){
    h += fld('标题', 'title');
    h += fld('id', 'id', 'text', ' placeholder="如 B-21"');
    h += sel('所属功能点', 'feature', FEATURES.filter(function(f){ return f.id !== '_orphan'; }).map(function(f){ return {v:f.id, t:f.title}; }));
    h += sel('类型（决定门链）', 'type', LOOP_TYPES.map(function(t){ return {v:t, t:TYPE_LABEL[t] || t}; }));
    h += sel('严重度', 'severity', [{v:'S0',t:'S0 致命'},{v:'S1',t:'S1 高'},{v:'S2',t:'S2 中'},{v:'S3',t:'S3 低'}]);
    h += sel('优先级', 'priority', LOOP_PRIORITIES.map(function(x){ return {v:x, t:x}; }));
  } else if (kind === 'module'){
    h += fld('标题', 'title');
    h += fld('id', 'id');
    h += fld('顺序', 'order', 'number');
  } else {
    h += fld('版本号', 'v', 'text', ' placeholder="v0.6.0"');
    h += fld('发布日期', 'date', 'date');
  }
  h += '<div class="nf-row"><label>' + (kind === 'bug' ? '背景（写进工作项的「背景」小节，可空）' : '说明（正文首段，可空）') + '</label><textarea data-nf="note">' + esc(NF_VALUES.note || '') + '</textarea></div>';
  h += '</div><div class="nf-foot"><span class="nf-err">' + esc(NF_ERR) + '</span><button class="nf-btn pri" data-nf-act="save">上图</button></div>';
  el.innerHTML = h;
}
function openNewForm(preset){
  NF_KIND = (preset && preset.kind) || 'feature';
  NF_VALUES = defaultsFor(NF_KIND);
  // 键盘起节点时把上下文预填进来（root/模块 → 模块下功能；功能 → 子/同级功能）
  if (preset && preset.values){
    Object.keys(preset.values).forEach(function(k){
      if (preset.values[k] != null) NF_VALUES[k] = String(preset.values[k]);
    });
  }
  NF_ERR = '';
  renderNewForm();
  document.getElementById('newform').classList.remove('hidden');
  var first = document.querySelector('#newform .nf-body input, #newform .nf-body select');
  if (first) first.focus();
}
function closeNewForm(){
  var el = document.getElementById('newform');
  var ae = document.activeElement;
  if (ae && el.contains(ae)) ae.blur();  // 隐藏后 input 仍抱着焦点，会吃掉键盘事件
  el.classList.add('hidden');
}

function saveNewForm(){
  readForm();
  var errs = validateNew(NF_KIND, NF_VALUES);
  if (errs.length){ NF_ERR = errs[0] + (errs.length > 1 ? '（另有 ' + (errs.length - 1) + ' 条）' : ''); renderNewForm(); return; }
  var rec = toRecord(NF_KIND, NF_VALUES);
  rec.__draft = true;
  DRAFTS.push({ kind:NF_KIND, data:rec, savedPath:null });
  saveDrafts();
  arrOf(NF_KIND).push(rec);
  focusId = NF_KIND === 'feature' ? rec.id : NF_KIND === 'module' ? 'mod-' + rec.id : null;
  refreshAll(); render(); renderDraftBar(); closeNewForm();
  hintEl.textContent = '已上图（草稿）· 保存 md 并跑 queue map build 才转正';
}

/* ---- 草稿条 ---- */
function renderDraftBar(){
  var bar = document.getElementById('draftbar');
  if (!bar) return;
  if (!DRAFTS.length){ bar.classList.add('hidden'); bar.innerHTML = ''; return; }
  bar.classList.remove('hidden');
  var h = '<div class="db-head">新建 ' + DRAFTS.length + ' 条 · 还没转正</div>';
  DRAFTS.forEach(function(d, i){
    var name = d.kind === 'release' ? d.data.v : d.data.id;
    var state = d.savedPath ? ('已写到 ' + d.savedPath + '，跑 queue map build 转正') : '只在浏览器里';
    h += '<div class="db-row"><div class="db-t"><b>' + esc(d.data.title || name) + '</b>' +
      '<span class="db-k">' + KIND_LABEL[d.kind] + ' · ' + esc(name) + '</span>' +
      '<div class="db-s">' + esc(state) + '</div></div><div class="db-a">' +
      (d.savedPath ? '' : '<button data-db="save" data-i="' + i + '">保存 md</button>') +
      '<button data-db="copy" data-i="' + i + '">复制</button>' +
      '<button data-db="drop" data-i="' + i + '" title="从图上撤掉">×</button></div></div>';
  });
  h += '<div class="db-foot"><button class="nf-btn" data-db="saveall">全部保存</button><button class="nf-btn" data-db="hide">收起</button></div>';
  bar.innerHTML = h;
}

function legacyCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function copyMd(text){
  var done = function(){ hintEl.textContent = 'md 已复制，粘到对应目录即可'; };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text); done(); });
  } else { legacyCopy(text); done(); }
}

async function writeDraft(i){
  var d = DRAFTS[i];
  if (!d) return;
  // serve 模式（queue map serve 起的 http://127.0.0.1）：直接 POST 给引擎写 md + 重建，
  // 不依赖 File System Access（file:// 下它不可靠，人就没法在界面编辑了）。
  // 写完页面刷新，节点从真实 md 里回来（草稿自动退场）。
  if (location.protocol === 'http:' || location.protocol === 'https:'){
    try {
      var kind = d.kind === 'bug' ? 'item' : d.kind;
      var data = d.kind === 'bug'
        ? { id:d.data.id, title:d.data.title, type:d.data.loopType, priority:d.data.loopPriority,
            severity:d.data.loopSeverity, feature:d.data.feature, note:d.data.note }
        : d.data;
      var r = await fetch(MAP_API_ROOT + '/new', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ kind: kind, data: data, repo: MAP_REPO }) });
      var j = await r.json();
      if (!r.ok) throw new Error((j.errors || [j.error || '写入失败']).join('；'));
      d.savedPath = j.path;
      saveDrafts(); renderDraftBar();
      hintEl.textContent = '已写入 ' + j.path + '（引擎写盘，页面即将刷新）';
      setTimeout(function(){ location.reload(); }, 500);
    } catch (err) {
      alert('写盘失败：' + ((err && err.message) || err));
    }
    return;
  }
  try {
    if (!window.showDirectoryPicker) throw new Error('这个浏览器不支持目录写入，请用 Chrome / Edge，或用「复制」');
    if (!dirHandle) dirHandle = await window.showDirectoryPicker({ id: 'loop-map', mode: 'readwrite' });
    // 选的是消费者仓库根：先下潜 loop/，再进目标子目录（都 create:true，目录不存在就建）
    var loopDir = await dirHandle.getDirectoryHandle('loop', { create: true });
    var sub = await loopDir.getDirectoryHandle(dirOf(d.kind), { create: true });
    var name = fileNameOf(d.kind, d.data);
    var fh = await sub.getFileHandle(name, { create: true });
    var w = await fh.createWritable();
    await w.write(mdOf(d.kind, d.data));
    await w.close();
    d.savedPath = 'loop/' + dirOf(d.kind) + '/' + name;
    saveDrafts(); renderDraftBar();
    hintEl.textContent = '已写入 ' + d.savedPath + ' · 跑 node bin/loop.mjs queue map build 转正';
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    alert('写盘失败：' + ((err && err.message) || err) + '\n可以先用「复制」把 md 粘进文件。');
  }
}
function dropDraft(i){
  var d = DRAFTS[i];
  if (!d) return;
  DRAFTS.splice(i, 1);
  saveDrafts();
  var arr = arrOf(d.kind), idf = idFieldOf(d.kind), id = d.data[idf];
  for (var j = arr.length - 1; j >= 0; j--) if (arr[j][idf] === id && arr[j].__draft) arr.splice(j, 1);
  refreshAll(); render(); closeCard(); renderDraftBar();
}

document.getElementById('newNode').onclick = function(){ openNewForm(); };
(function wireNewForm(){
  var el = document.getElementById('newform');
  el.addEventListener('change', function(e){
    readForm();
    if (e.target.id === 'nf-kind' || e.target.dataset.nf === 'status'){
      if (e.target.id === 'nf-kind') NF_VALUES = defaultsFor(NF_KIND);
      NF_ERR = '';
      renderNewForm();
    }
  });
  el.addEventListener('click', function(e){
    var b = e.target.closest('[data-nf-act]');
    if (!b) return;
    if (b.dataset.nfAct === 'save') saveNewForm();
    else closeNewForm();
  });
  var bar = document.getElementById('draftbar');
  bar.addEventListener('click', function(e){
    var b = e.target.closest('[data-db]');
    if (!b) return;
    var act = b.dataset.db, i = Number(b.dataset.i);
    if (act === 'save') writeDraft(i);
    else if (act === 'copy') copyMd(mdOf(DRAFTS[i].kind, DRAFTS[i].data));
    else if (act === 'drop') dropDraft(i);
    else if (act === 'saveall') DRAFTS.forEach(function(_, k){ writeDraft(k); });
    else if (act === 'hide') document.getElementById('draftbar').classList.add('hidden');
  });
})();

DRAFTS = loadDrafts();
injectDrafts();
refreshAll();
renderDraftBar();

// 点完 header / 草稿条上的按钮就把焦点还给画布，方向键才能继续走树
document.querySelector('header').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (b) b.blur();
});
document.getElementById('draftbar').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (b) b.blur();
});

applyChrome();
syncSliderFill();
render();
</script>
