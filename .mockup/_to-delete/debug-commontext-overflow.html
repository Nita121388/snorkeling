<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>调试：CommonText 搜索弹窗溢出问题</title>
    <style>
        /* ---------- 模拟全局 CSS 变量 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1e;
            color: #e3e3e8;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* ---------- Modal wrapper (from modal.scss) ---------- */
        .modal-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-backdrop {
            position: fixed;
            top: 36px;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(21, 23, 21, 0.7);
        }

        /* ---------- Modal shell ---------- */
        .modal {
            position: relative;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-radius: 8px;
            border: 0.5px solid #38383e;
            background: #232327;
            box-shadow: 0px 8px 32px 0px rgba(0,0,0,0.25);
            width: min(760px, calc(100vw - 32px));
            max-height: min(720px, calc(100vh - 32px));
            padding-top: 32px;  /* pt-8 */
            padding-bottom: 16px; /* pb-4 */
        }

        .modal-close-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: #7c7c88;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
        }
        .modal-close-btn:hover { color: #e3e3e8; }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .modal-content {
            width: 100%;
            padding: 0px 20px;
        }

        /* ---------- 搜索弹窗内部样式 ---------- */
        .search-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            height: 100%;
        }
        .search-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding-right: 32px; /* pr-8 */
        }
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        .header-hint {
            font-size: 12px;
            color: #7c7c88;
            margin-top: 2px;
        }
        .manage-btn {
            height: 32px;
            padding: 0 8px;
            border-radius: 6px;
            border: 1px solid #38383e;
            background: transparent;
            color: #a0a0a8;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .manage-btn:hover {
            color: #e3e3e8;
            background: #2a2a2e;
        }

        /* search input */
        .input-group {
            position: relative;
        }
        .search-input {
            width: 100%;
            height: 36px;
            padding: 0 36px 0 12px;
            background: #1e1e22;
            border: 1px solid #38383e;
            border-radius: 8px;
            color: #e3e3e8;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: #6366f1; }
        .search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c6c76;
        }

        /* tags */
        .tags-row {
            max-height: 80px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            padding: 0 8px;
            border: 1px solid #38383e;
            border-radius: 999px;
            background: transparent;
            color: #a0a0a8;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* status */
        .status-text {
            font-size: 12px;
            color: #6366f1;
            min-height: 18px;
        }

        /* list container */
        .list-container {
            min-height: 0;
            flex: 1;
            border: 1px solid #38383e;
            border-radius: 8px;
            overflow: hidden;
        }
        .list-scroll-area {
            height: 100%;
            overflow-y: auto;
        }

        /* virtual items - 用大量数据模拟 */
        .virtual-spacer {
            position: relative;
            width: 100%;
        }
        .virtual-item {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid transparent;
        }
        .virtual-item:nth-child(odd) {
            background: #232327;
        }
        .virtual-item:nth-child(even) {
            background: #1e1e22;
        }

        .item-pin { width: 16px; flex-shrink: 0; text-align: center; font-size: 11px; color: #7c7c88; padding-top: 3px; }
        .item-body { flex: 1; min-width: 0; }
        .item-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-preview { font-size: 12px; color: #7c7c88; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-copy-btn { width: 28px; height: 28px; flex-shrink: 0; border: none; border-radius: 6px; background: transparent; color: #7c7c88; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .debug-info {
            width: 760px;
            background: #1e1e22;
            border: 1px solid #38383e;
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 13px;
            color: #b0b0b8;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .debug-info .good { color: #4ade80; }
        .debug-info .bad { color: #f87171; }

        /* 不同场景的按钮组 */
        .scenario-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .scenario-buttons button {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #38383e;
            background: #1e1e22;
            color: #e3e3e8;
            cursor: pointer;
            font-size: 13px;
        }
        .scenario-buttons button:hover {
            background: #2a2a2e;
            border-color: #6366f1;
        }
        .scenario-buttons button.active {
            border-color: #6366f1;
            background: rgba(99,102,241,0.15);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
</head>
<body>

<div style="font-size:18px;font-weight:600;color:#b0b0b8;text-align:center;">
    🔍 布局调试 · CommonText 搜索弹窗
    <span style="display:block;font-size:13px;font-weight:400;color:#7c7c88;margin-top:4px;">模拟 Modal + content-wrapper + 搜索弹窗布局 — 调整窗口高度测试溢出行为</span>
</div>

<div class="scenario-buttons">
    <button class="active" data-scenario="default">默认（当前实现）</button>
    <button data-scenario="fix1">修复：min-h-0 + h-full</button>
    <button data-scenario="fix2">修复 + overflow-hidden</button>
    <button data-scenario="fix3">修复 + 去掉 content-wrapper</button>
</div>

<!-- ===================== MODAL ===================== -->
<div class="modal-wrapper" id="modal-wrapper">
    <div class="modal-backdrop"></div>
    <div class="modal" id="modal">
        <button class="modal-close-btn" title="Close (ESC)">
            <i class="fa-sharp fa-solid fa-xmark"></i>
        </button>
        <div class="content-wrapper">
            <div class="modal-content">
                <!-- 搜索弹窗内容 -->
                <div class="search-container" id="searchContainer">
                    <div class="search-header">
                        <div>
                            <div class="header-title">Common Text</div>
                            <div class="header-hint">Enter inserts. Cmd/Ctrl+Enter copies.</div>
                        </div>
                        <button class="manage-btn">
                            <i class="fa fa-solid fa-gear"></i>
                            Manage
                        </button>
                    </div>
                    <div class="input-group">
                        <input class="search-input" type="text" placeholder="Search..." value="deploy" />
                        <span class="search-icon"><i class="fa-regular fa-magnifying-glass"></i></span>
                    </div>
                    <div class="tags-row">
                        <span class="tag-chip">shell</span>
                        <span class="tag-chip selected">git</span>
                        <span class="tag-chip">docker</span>
                        <span class="tag-chip">ssh</span>
                        <span class="tag-chip">k8s</span>
                    </div>
                    <div class="status-text"></div>
                    <!-- list container -->
                    <div class="list-container" id="listContainer">
                        <div class="list-scroll-area" id="scrollArea">
                            <div class="virtual-spacer" id="virtualSpacer" style="height: 2000px;">
                                <!-- JS 动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===================== DEBUG INFO ===================== -->
<div class="debug-info" id="debugInfo">
    ⏳ 计算中...
</div>

<script>
// ---------- 生成 mock 数据 ----------
const ITEM_COUNT = 30;
const ITEM_HEIGHT = 64;
const spacer = document.getElementById('virtualSpacer');
for (let i = 0; i < ITEM_COUNT; i++) {
    const item = document.createElement('div');
    item.className = 'virtual-item';
    item.style.top = (i * ITEM_HEIGHT) + 'px';
    item.style.height = ITEM_HEIGHT + 'px';
    item.innerHTML = `
        <div class="item-pin"><i class="fa fa-solid fa-thumbtack"></i></div>
        <div class="item-body">
            <div class="item-title">Deploy item #${i + 1}</div>
            <div class="item-preview">npm run build && rsync -avz dist/ deploy@staging:/var/www/app</div>
        </div>
        <button class="item-copy-btn"><i class="fa-regular fa-copy"></i></button>
    `;
    spacer.appendChild(item);
}

// ---------- 实时调试信息 ----------
function gatherMetrics() {
    const modal = document.getElementById('modal');
    const wrapper = document.querySelector('.modal-wrapper');
    const container = document.getElementById('searchContainer');
    const list = document.getElementById('listContainer');
    const scroll = document.getElementById('scrollArea');
    const contentWrapper = document.querySelector('.content-wrapper');
    const modalContent = document.querySelector('.modal-content');

    function rect(el) {
        if (!el) return { h:0, ch:0, display:'missing' };
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        return { h: r.height, ch: r.height, display: cs.display, flex: cs.flex, overflow: cs.overflow, maxHeight: cs.maxHeight };
    }

    const m = rect(modal);
    const cw = rect(contentWrapper);
    const mc = rect(modalContent);
    const sc = rect(container);
    const l = rect(list);
    const sr = rect(scroll);

    // 检查溢出
    const vpHeight = window.innerHeight;
    const modalBottom = modal.getBoundingClientRect().bottom;
    const overflowsVp = modalBottom > vpHeight;
    const scrollOverflow = sr.ch > l.ch && l.ch > 0;
    const totalItemsHeight = ITEM_COUNT * ITEM_HEIGHT;

    let issues = [];
    if (overflowsVp) issues.push('❌ Modal 底部超出视口');
    if (l.ch <= 0 || l.ch < 10) issues.push('❌ 列表容器高度坍缩');
    if (scrollOverflow) issues.push('❌ 滚动区域 > 列表容器（内容溢出圆角）');

    const modalStyle = getComputedStyle(modal);
    const cwStyle = getComputedStyle(contentWrapper);
    const mcStyle = getComputedStyle(modalContent);

    return {
        viewportHeight: vpHeight,
        modal: { height: m.h, maxHeight: modalStyle.maxHeight, padding: modalStyle.padding, overflow: modalStyle.overflow },
        modalTop: Math.round(modal.getBoundingClientRect().top),
        modalBottom: Math.round(modalBottom),
        contentWrapper: { height: cw.h, display: cw.display, flexDirection: cwStyle.flexDirection },
        modalContent: { height: mc.h, padding: mcStyle.padding },
        searchContainer: { height: sc.h, minHeight: sc.minHeight, display: display },
        listContainer: { height: l.h, flex: l.flex, overflow: l.overflow },
        scrollArea: { height: sr.h },
        totalItemsHeight,
        overflowsVp,
        scrollOverflow,
        issues: issues.length ? issues : ['✅ 无溢出问题'],
    };
}

function renderDebug(info) {
    const el = document.getElementById('debugInfo');
    let html = `视口高度: ${info.viewportHeight}px
Modal 高度: ${info.modal.height}px (max: ${info.modal.maxHeight} / top: ${info.modalTop} / bottom: ${info.modalBottom})
  overflow: ${info.modal.overflow}  padding: ${info.modal.padding}

content-wrapper: height=${info.contentWrapper.height} display=${info.contentWrapper.display} flex-direction=${info.contentWrapper.flexDirection}
modal-content: height=${info.modalContent.height} padding=${info.modalContent.padding}

search-container: height=${info.searchContainer.height}
list-container: height=${info.listContainer.height} flex=${info.listContainer.flex} overflow=${info.listContainer.overflow}
scroll-area: height=${info.scrollArea.height}

虚拟条目: ${ITEM_COUNT} × ${ITEM_HEIGHT}px = ${info.totalItemsHeight}px

`;
    info.issues.forEach(issue => {
        const ok = issue.startsWith('✅');
        html += `\n<span class="${ok ? 'good' : 'bad'}">${issue}</span>`;
    });
    // show flex chain
    html += `\n\n--- flex 链 ---`;
    html += `\n.modal:          flex-direction: ${info.modal.overflow}`;
    el.innerHTML = html;
}

function updateDebug() {
    renderDebug(gatherMetrics());
}

// ---------- 场景切换 ----------
const scenarios = {
    default() {
        const modal = document.getElementById('modal');
        modal.style.paddingTop = '32px';
        modal.style.paddingBottom = '16px';
        const sc = document.getElementById('searchContainer');
        sc.style.minHeight = '420px';
        sc.style.height = '';
        const list = document.getElementById('listContainer');
        list.style.overflow = '';
        list.style.height = '';
    },
    fix1() {
        const modal = document.getElementById('modal');
        modal.style.paddingTop = '32px';
        modal.style.paddingBottom = '16px';
        const sc = document.getElementById('searchContainer');
        sc.style.minHeight = '0';
        sc.style.height = '100%';
        const list = document.getElementById('listContainer');
        list.style.overflow = '';
        list.style.height = '';
    },
    fix2() {
        this.fix1();
        const list = document.getElementById('listContainer');
        list.style.overflow = 'hidden';
        list.style.height = '';
    },
    fix3() {
        // 模拟使用 FlexiModal (无 content-wrapper)
        const cw = document.querySelector('.content-wrapper');
        cw.style.height = '100%';
        cw.style.flex = '1';
        cw.style.minHeight = '0';
        const mc = document.querySelector('.modal-content');
        mc.style.height = '100%';
        mc.style.padding = '0 20px';
        this.fix2();
    }
};

document.querySelectorAll('.scenario-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.scenario-buttons button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // reset all
        const cw = document.querySelector('.content-wrapper');
        cw.style.height = '';
        cw.style.flex = '';
        cw.style.minHeight = '';
        const mc = document.querySelector('.modal-content');
        mc.style.height = '';
        mc.style.padding = '';
        const sc = document.getElementById('searchContainer');
        sc.style.minHeight = '';
        sc.style.height = '';
        const list = document.getElementById('listContainer');
        list.style.overflow = '';
        list.style.height = '';
        // apply scenario
        scenarios[btn.dataset.scenario]();
        requestAnimationFrame(updateDebug);
    });
});

// ---------- 初始计算 + resize ----------
updateDebug();
window.addEventListener('resize', updateDebug);
// 每 500ms 重新计算
setInterval(updateDebug, 500);
</script>

</body>
</html>
