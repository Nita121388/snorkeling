# Workflow to bump the package version, commit it, and create a Snorkeling release tag.
# Tags emitted by this workflow are compatible with .github/workflows/snorkeling-release.yml

name: Bump Version
run-name: "branch: ${{ github.ref_name }}; semver-bump: ${{ inputs.bump }}; prerelease: ${{ inputs.is-prerelease }}"
on:
    workflow_dispatch:
        inputs:
            bump:
                description: SemVer Bump
                required: true
                type: choice
                default: none
                options:
                    - none
                    - patch
                    - minor
                    - major
            is-prerelease:
                description: Is Prerelease
                required: true
                type: boolean
                default: true
            tag-suffix:
                description: Optional tag suffix (for retries), e.g. -snorkeling.1
                required: false
                type: string
                default: ""
env:
    NODE_VERSION: 22
jobs:
    bump-version:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # General build dependencies
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: "Bump Version: ${{ inputs.bump }}"
              id: bump-version
              run: echo "WAVETERM_VERSION=$( task version -- ${{ inputs.bump }} ${{inputs.is-prerelease}} )" >> "$GITHUB_OUTPUT"
              shell: bash

            - name: "Commit version bump: ${{ steps.bump-version.outputs.WAVETERM_VERSION }}"
              id: commit-version
              run: |
                  set -euo pipefail
                  VERSION="${{ steps.bump-version.outputs.WAVETERM_VERSION }}"
                  if git diff --quiet -- package.json; then
                      echo "package.json already at version $VERSION, skipping commit."
                      echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json
                  git commit -m "chore: bump package version to $VERSION"
                  git push origin "HEAD:${{ github.ref_name }}"
                  echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: "Create snorkeling tag"
              run: |
                  set -euo pipefail
                  VERSION="${{ steps.bump-version.outputs.WAVETERM_VERSION }}"
                  TAG="snorkeling-v${VERSION}${{ inputs.tag-suffix }}"
                  TARGET_SHA="${{ steps.commit-version.outputs.COMMIT_SHA }}"
                  if [ -z "$TARGET_SHA" ]; then
                      TARGET_SHA="$(git rev-parse HEAD)"
                  fi

                  git fetch --tags origin
                  if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
                      echo "Tag $TAG already exists, skipping tag push."
                      exit 0
                  fi

                  git tag "$TAG" "$TARGET_SHA"
                  git push origin "refs/tags/$TAG"
                  echo "Created tag $TAG at $TARGET_SHA"
              shell: bash
