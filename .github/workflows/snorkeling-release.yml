name: Snorkeling Release
run-name: Release ${{ github.ref_name }}

on:
    push:
        tags:
            - "v*"
            - "snorkeling-v*"
    workflow_dispatch:

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096

jobs:
    build:
        name: Build ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-go@v6
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      go.sum

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:

            - name: Linux packaging dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools rpm squashfs-tools
                  sudo gem install fpm

            - name: Install Zig (non-macOS)
              if: matrix.os != 'macos-latest'
              uses: mlugg/setup-zig@v2

            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 10
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"

            - name: Align app version with release tag
              if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/snorkeling-v')
              shell: bash
              run: |
                  set -euo pipefail
                  TAG_NAME="${GITHUB_REF_NAME}"
                  if [[ "$TAG_NAME" == v* ]]; then
                      APP_VERSION="${TAG_NAME#v}"
                  elif [[ "$TAG_NAME" == snorkeling-v* ]]; then
                      RAW_TAG="${TAG_NAME#snorkeling-v}"
                      if [[ ! "$RAW_TAG" =~ ^(.+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                          echo "invalid snorkeling tag format: $TAG_NAME"
                          exit 1
                      fi
                      UPSTREAM_VERSION="${BASH_REMATCH[1]}"
                      LOCAL_VERSION="${BASH_REMATCH[2]}"
                      if [[ "$UPSTREAM_VERSION" == *-* ]]; then
                          APP_VERSION="${UPSTREAM_VERSION}.snorkeling.${LOCAL_VERSION}"
                      else
                          APP_VERSION="${UPSTREAM_VERSION}-snorkeling.${LOCAL_VERSION}"
                      fi
                  else
                      echo "unsupported tag format: $TAG_NAME"
                      exit 1
                  fi

                  echo "Using app version: $APP_VERSION"
                  APP_VERSION="$APP_VERSION" node -e 'const fs=require("fs"); const p="package.json"; const pkg=JSON.parse(fs.readFileSync(p,"utf8")); pkg.version=process.env.APP_VERSION; fs.writeFileSync(p, JSON.stringify(pkg,null,4)+"\n"); console.log("package.json version ->", pkg.version);'

            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Detect macOS signing secrets
              id: macos-signing
              if: matrix.os == 'macos-latest'
              shell: bash
              env:
                  CSC_LINK: ${{ secrets.PROD_MACOS_CERTIFICATE_2 }}
                  CSC_KEY_PASSWORD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD_2 }}
                  APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID_2 }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD_2 }}
                  APPLE_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID_2 }}
              run: |
                  set -euo pipefail
                  missing=0
                  for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                      if [[ -z "${!name:-}" ]]; then
                          echo "::warning::$name is missing; unsigned macOS release artifacts will be built"
                          missing=1
                      fi
                  done
                  if [[ "$missing" == "0" ]]; then
                      echo "SNORKELING_MACOS_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
                      echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "SNORKELING_MACOS_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
                      echo "available=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build distributables (Linux)
              if: matrix.os == 'ubuntu-latest'
              run: task package
              env:
                  USE_SYSTEM_FPM: true

            - name: Build distributables (macOS signed)
              if: matrix.os == 'macos-latest' && steps.macos-signing.outputs.available == 'true'
              run: task package
              env:
                  USE_SYSTEM_FPM: true
                  CSC_IDENTITY_AUTO_DISCOVERY: true
                  CSC_LINK: ${{ secrets.PROD_MACOS_CERTIFICATE_2 }}
                  CSC_KEY_PASSWORD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD_2 }}
                  APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID_2 }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD_2 }}
                  APPLE_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID_2 }}
                  SNORKELING_FORCE_MACOS_SIGNING: true

            - name: Build distributables (macOS unsigned)
              if: matrix.os == 'macos-latest' && steps.macos-signing.outputs.available != 'true'
              shell: bash
              run: |
                  unset CSC_LINK CSC_KEY_PASSWORD CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD
                  unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
                  task package
              env:
                  USE_SYSTEM_FPM: true
                  CSC_IDENTITY_AUTO_DISCOVERY: false
                  SNORKELING_FORCE_MACOS_SIGNING: false

            - name: Build distributables (Windows)
              if: matrix.os == 'windows-latest'
              run: task package
              env:
                  USE_SYSTEM_FPM: true
                  CSC_IDENTITY_AUTO_DISCOVERY: false
              shell: powershell

            - name: Upload build artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: release-${{ matrix.os }}
                  path: make/*

    publish:
        name: Publish GitHub Release
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/snorkeling-v')
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  path: make
                  merge-multiple: true

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  files: |
                      make/*.zip
                      make/*.dmg
                      make/*.exe
                      make/*.msi
                      make/*.rpm
                      make/*.deb
                      make/*.pacman
                      make/*.snap
                      make/*.flatpak
                      make/*.AppImage
                      make/*.yml
                      make/*.blockmap
