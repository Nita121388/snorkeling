<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <radialGradient id="wheelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.8" stop-color="#2a2a2e"/>
      <stop offset="0.86" stop-color="#4a4a50"/>
      <stop offset="1" stop-color="#6a6a72"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="120" cy="90" r="38" fill="#ffd977"/>

  <!-- Ground -->
  <rect x="0" y="468" width="800" height="132" fill="#bfe0b0"/>
  <line x1="0" y1="468" x2="800" y2="468" stroke="#a3ca8f" stroke-width="3"/>

  <!-- ===================== BICYCLE ===================== -->

  <!-- Wheel shadow -->
  <ellipse cx="220" cy="472" rx="78" ry="10" fill="rgba(0,0,0,0.15)"/>
  <ellipse cx="520" cy="472" rx="78" ry="10" fill="rgba(0,0,0,0.15)"/>

  <!-- REAR WHEEL -->
  <g id="rear-wheel">
    <circle cx="220" cy="400" r="70" fill="none" stroke="#33363d" stroke-width="11"/>
    <circle cx="220" cy="400" r="60" fill="none" stroke="#9aa0a8" stroke-width="2"/>
    <circle cx="220" cy="400" r="7" fill="#3c3f45"/>
    <!-- spokes -->
    <g stroke="#b7bcc4" stroke-width="1.6">
      <line x1="220" y1="340" x2="220" y2="460"/>
      <line x1="150" y1="400" x2="290" y2="400"/>
      <line x1="171" y1="351" x2="269" y2="449"/>
      <line x1="269" y1="351" x2="171" y2="449"/>
    </g>
  </g>

  <!-- FRONT WHEEL -->
  <g id="front-wheel">
    <circle cx="520" cy="400" r="70" fill="none" stroke="#33363d" stroke-width="11"/>
    <circle cx="520" cy="400" r="60" fill="none" stroke="#9aa0a8" stroke-width="2"/>
    <circle cx="520" cy="400" r="7" fill="#3c3f45"/>
    <g stroke="#b7bcc4" stroke-width="1.6">
      <line x1="520" y1="340" x2="520" y2="460"/>
      <line x1="450" y1="400" x2="590" y2="400"/>
      <line x1="471" y1="351" x2="569" y2="449"/>
      <line x1="569" y1="351" x2="471" y2="449"/>
    </g>
  </g>

  <!-- FRAME  (diamond geometry) -->
  <!-- reference points:
       R=rear axle(220,400) F=front axle(520,400) BB=crank(330,400)
       ST=seat tube top(285,275) HTT=head tube top(495,285) HTB=head tube bottom(485,335)
  -->
  <g stroke="#d04a2a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- chain stay: R -> BB -->
    <line x1="220" y1="400" x2="330" y2="400"/>
    <!-- seat stay: R -> ST -->
    <line x1="220" y1="400" x2="285" y2="275"/>
    <!-- seat tube: BB -> ST -->
    <line x1="330" y1="400" x2="285" y2="275"/>
    <!-- top tube: ST -> HTT -->
    <line x1="285" y1="275" x2="495" y2="285"/>
    <!-- down tube: BB -> HTB -->
    <line x1="330" y1="400" x2="485" y2="335"/>
    <!-- head tube: HTT -> HTB -->
    <line x1="495" y1="285" x2="485" y2="335"/>
    <!-- fork: HTB -> F -->
    <line x1="485" y1="335" x2="520" y2="400"/>
  </g>

  <!-- drivetrain -->
  <g id="drivetrain">
    <!-- chainring -->
    <circle cx="330" cy="400" r="22" fill="none" stroke="#8c8f96" stroke-width="4"/>
    <circle cx="330" cy="400" r="8" fill="#5a5d64"/>
    <!-- rear cog -->
    <circle cx="220" cy="400" r="12" fill="none" stroke="#8c8f96" stroke-width="4"/>
    <circle cx="220" cy="400" r="5" fill="#5a5d64"/>
    <!-- chain -->
    <path d="M 312 384 L 230 391" stroke="#5a5d64" stroke-width="3" fill="none"/>
    <path d="M 348 416 L 210 409" stroke="#5a5d64" stroke-width="3" fill="none"/>
  </g>

  <!-- cranks + pedals (opposite phase) -->
  <g stroke="#c9ccd2" stroke-width="7" stroke-linecap="round">
    <line x1="330" y1="400" x2="300" y2="370"/> <!-- rear/up crank -->
    <line x1="330" y1="400" x2="360" y2="430"/> <!-- front/down crank -->
  </g>
  <!-- pedal platforms -->
  <rect x="292" y="364" width="20" height="8" rx="2" fill="#7a7d84"/>
  <rect x="352" y="424" width="20" height="8" rx="2" fill="#7a7d84"/>

  <!-- seat -->
  <path d="M 258 268 Q 285 258 312 270 Q 300 280 272 278 Z" fill="#3c3f45"/>
  <!-- seat post -->
  <line x1="285" y1="275" x2="285" y2="255" stroke="#9aa0a8" stroke-width="6"/>

  <!-- handlebar stem + bar -->
  <line x1="495" y1="285" x2="505" y2="258" stroke="#c9ccd2" stroke-width="7"/>
  <path d="M 484 254 Q 505 244 528 252" stroke="#3c3f45" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- ===================== PELICAN ===================== -->
  <!-- sitting on seat ~(285,275), facing right, feet on pedals -->

  <!-- far leg (right foot) to rear/up pedal (300,370) -->
  <g stroke="#f2b040" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 285 262 Q 268 300 300 370"/>
  </g>
  <!-- far webbed foot on rear pedal -->
  <path d="M 300 370 L 288 358 M 300 370 L 298 356 M 300 370 L 306 356" stroke="#e89b2d" stroke-width="4" fill="none"/>

  <!-- tail -->
  <path d="M 228 200 L 182 196 L 222 216 Z" fill="#6d6d75"/>
  <path d="M 232 196 L 188 182 L 226 206 Z" fill="#54545b"/>

  <!-- body -->
  <ellipse cx="272" cy="206" rx="92" ry="58" fill="#f6f4ef"/>
  <!-- body shading -->
  <ellipse cx="268" cy="214" rx="84" ry="48" fill="#ece9e1"/>

  <!-- wing (folded, near side) -->
  <path d="M 225 190 Q 268 160 320 196 Q 288 236 238 234 Q 218 212 225 190 Z" fill="#ffffff"/>
  <path d="M 228 196 Q 268 172 314 198" stroke="#d8d4cb" stroke-width="3" fill="none"/>
  <!-- far wing tip visible -->
  <path d="M 250 174 Q 300 178 322 200" stroke="#9fa3ab" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- neck rising from body to head -->
  <path d="M 320 208 C 352 196 366 160 382 132" stroke="#f6f4ef" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M 322 210 C 354 198 367 160 383 134" stroke="#ece9e1" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="388" cy="120" r="20" fill="#f6f4ef"/>

  <!-- eye -->
  <circle cx="396" cy="114" r="3.4" fill="#2b2b2e"/>
  <circle cx="397" cy="113" r="1" fill="#ffffff"/>

  <!-- beak (long upper bill) -->
  <path d="M 380 108 C 440 100 500 102 560 116 C 500 122 420 124 384 128 Z" fill="#f6a623"/>

  <!-- pouch (hanging under beak) -->
  <path d="M 384 126 C 360 168 322 176 300 158 C 318 140 350 136 382 128 Z" fill="#f7b94b" opacity="0.95"/>

  <!-- near leg (left foot) to front/down pedal (360,430) -->
  <g stroke="#f2b040" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 292 262 Q 300 320 360 430"/>
  </g>
  <!-- near webbed foot on front pedal -->
  <path d="M 360 430 L 344 422 M 360 430 L 356 418 M 360 430 L 366 420" stroke="#e89b2d" stroke-width="4.5" fill="none"/>

  <!-- back feathers / crest on head -->
  <path d="M 378 102 Q 372 90 382 92" stroke="#d8d4cb" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
