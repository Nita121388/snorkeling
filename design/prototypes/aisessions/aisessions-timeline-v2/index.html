<!doctype html>
<html lang="zh-CN" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>批注时间线 v2 · 时间桶分页 / UI / 外部 Agent 写入 · 原型</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="proto-bar">
            <div class="proto-title">
                <span class="dot-mark"></span>
                <div>
                    <div class="pt-main">Annotation Timeline v2</div>
                    <div class="pt-sub">时间桶分页 · UI 美化 · 外部 agent 写入 · ▲ 原型</div>
                </div>
            </div>
            <div class="proto-controls">
                <span class="proto-hint" id="stateReadout">窗口 2/5 桶 · 5 条批注</span>
                <button id="dateJump" class="proto-btn" type="button" aria-expanded="false">日期跳转 ▾</button>
                <button id="extWrite" class="proto-btn" type="button">模拟外部写入</button>
                <button id="themeToggle" class="proto-btn" type="button">Light</button>
            </div>
        </header>

        <main class="stage">
            <aside class="rail" id="rail" aria-label="Annotation timeline">
                <div class="rail-head" id="railHead">
                    <div class="rail-title" id="railToggle" title="Collapse annotation timeline">Notes</div>
                    <button class="rail-ai" type="button" title="Generate annotation timeline with AI">
                        <span class="rail-ai-icon">✨</span><span class="rail-ai-label">AI</span>
                    </button>
                    <!-- 视口外新批注 pill：默认隐藏，外部写入到达时出现 -->
                    <button class="rail-newpill" id="newPill" type="button" hidden></button>
                </div>
                <div class="rail-body" id="railBody"></div>
            </aside>
            <section class="flow-wrap">
                <!-- 「加载更早」：窗口未到最早桶时始终在顶（滚动区外，不被重渲染清掉） -->
                <button class="load-older" id="loadOlder" type="button"></button>
                <div class="flow" id="flow" aria-label="Session detail"></div>
                <!-- 回到最新：向上滚出一段距离后出现 -->
                <button class="fab-latest" id="fabLatest" type="button" hidden>↓ 回到最新</button>
            </section>
        </main>

        <!-- 日期跳转下拉（#dateJump 触发，fixed 定位到按钮下方） -->
        <div class="jump-menu" id="jumpMenu" hidden></div>

        <!-- 悬浮卡层：脱离 rail 的滚动/层叠限制，钉在视口坐标系 -->
        <div class="card-layer" id="cardLayer" aria-live="polite"></div>

        <script src="script.js"></script>
    </body>
</html>
