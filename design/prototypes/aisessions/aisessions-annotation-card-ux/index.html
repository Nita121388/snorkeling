<!doctype html>
<html lang="zh-CN" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Annotation Card / Rail UX · 原型</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="proto-bar">
            <div class="proto-title">
                <span class="dot-mark"></span>
                <div>
                    <div class="pt-main">Annotation Card / Rail UX</div>
                    <div class="pt-sub">会话详情 · 批注节点悬浮卡重设计 · ▲ 原型</div>
                </div>
            </div>
            <div class="proto-controls">
                <span class="proto-hint">hover 看卡 · 单击选中 · 双击跳转</span>
                <button id="dataToggle" class="proto-btn" type="button">Data: Default</button>
                <button id="themeToggle" class="proto-btn" type="button">Light</button>
            </div>
        </header>

        <main class="stage">
            <aside class="rail" id="rail" aria-label="Annotation timeline">
                <div class="rail-head">
                    <span class="rail-title">Annotations</span>
                </div>
                <div class="rail-body" id="railBody"></div>
            </aside>
            <section class="flow" id="flow" aria-label="Session detail"></section>
        </main>

        <div class="card-layer" id="cardLayer" aria-live="polite"></div>
        <div id="editorLayer"></div>

        <script src="script.js"></script>
    </body>
</html>
