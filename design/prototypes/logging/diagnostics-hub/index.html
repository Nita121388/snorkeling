<!doctype html>
<html lang="zh-CN" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>诊断中心 · Diagnostics Hub · 原型</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="proto-bar">
            <div class="proto-title">
                <span class="dot-mark"></span>
                <div>
                    <div class="pt-main">Diagnostics Hub 诊断中心</div>
                    <div class="pt-sub">AI 调用审计 × 运行日志 × 联合时间线 · 融合原型 · ▲ 未实现</div>
                </div>
            </div>
            <div class="proto-controls">
                <label class="proto-select">
                    <span>场景</span>
                    <select id="scenario">
                        <option value="normal">正常（含失败与在途）</option>
                        <option value="failstorm">失败风暴（错误限流 + 预算）</option>
                        <option value="off">隐私关闭（log:level=off）</option>
                        <option value="empty">空态</option>
                    </select>
                </label>
                <button class="proto-btn" id="themeToggle" type="button" title="切换明暗主题">◐ 明暗</button>
            </div>
        </header>

        <main class="diag-root" id="root">
            <!-- 工具栏：三种视图共用一套骨架（对齐 aiaudit-view.tsx 的 grammar） -->
            <div class="diag-toolbar" id="toolbar"></div>
            <!-- 联动横幅：跨视图跳转后的来路提示 -->
            <div class="diag-banner" id="banner" hidden></div>
            <!-- 统计条：各视图一种内容，同一套排版 -->
            <div class="diag-stats" id="stats"></div>
            <!-- 列表 -->
            <div class="diag-list" id="list"></div>
        </main>

        <!-- 共享详情抽屉：审计条目 / 日志事件两种内容形态 -->
        <aside class="diag-drawer" id="drawer" hidden></aside>

        <!-- 导出诊断包（融合动作三：审计失败 + 关联日志 → 一键成包） -->
        <div class="modal-mask" id="exportModal" hidden>
            <div class="modal-card">
                <div class="modal-head">
                    <span>诊断包预览（Markdown）</span>
                    <button class="proto-btn" id="exportClose" type="button">✕</button>
                </div>
                <pre class="export-pre" id="exportBody"></pre>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
